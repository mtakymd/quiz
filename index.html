[{"id":99,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"令和5年 問2","q":"正しいものはどれか。","opts":["分子は、ヘリウムなどの単原子分子の場合を除き、複数の原子が化学的に結合してできている。","アセチレンは、2種類の元素からできている混合物である。","原子量の単位は、g/molである。","アボガドロの法則によれば、すべての気体1molは、温度、圧力が同じならば、同一の体積を占める。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":2,"ok":[1,0,0,1],"ex":["◯ 分子は、ヘリウムなどの単原子分子の場合を除き、複数の原子が化学的に結合してできている。","✕ アセチレン（HC≡CH）は、2種類の元素からできている化合物である（混合物ではない）。","✕ 原子量は、炭素（C）の同位元素¹²Cの原子1個の質量の相対値を12としたときの、他の原子の相対質量をもって表す値であるため単位はない。なお、g/molは原子をアボガドロ数（6.02×10²³）集めた質量（モル質量）を指す。","◯ アボガドロの法則によれば、すべての気体1molは、温度・圧力が同じならば同一の体積を占める。"]},{"id":100,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"令和4年 問2","q":"正しいものはどれか。","opts":["窒素は、2種類の元素からできている。","原子量には単位がない。","二酸化炭素の状態は、臨界温度以下では、温度、圧力の変化によって、液体、気体の2つの間で変化する。","直接、固体から気体になる状態変化は、昇華である。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[0,1,0,1],"ex":["✕ 窒素（N₂）は、1種類の元素（N）からできている。","◯ 原子量は、炭素（C）の同位元素¹²Cの原子1個の質量の相対値を12としたときの相対質量で表す値であるため単位はない。","✕ 二酸化炭素の状態は、臨界温度以下では、液体・液体と飽和蒸気・気体の3つの間で変化する（2つではない）。","◯ 直接、固体から気体になる状態変化は昇華である（例：ドライアイス）。"]},{"id":101,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"令和3年 問2","q":"正しいものはどれか。","opts":["ある物質があって、その物質の固有の特性を示す最小の基本粒子を原子という。","分子の種類を元素という。","二酸化炭素は化合物である。","アボガドロの法則によれば、すべての気体において、同じ温度、同じ圧力のもとで、同じ体積中に含まれる分子の数は常に同じである。"],"chs":["イ、ロ","ロ、ニ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ"],"ans":3,"ok":[0,0,1,1],"ex":["✕ ある物質の固有の特性を示す最小の基本粒子は分子という。分子を構成している基本単位を原子という。","✕ 原子の種類（陽子の数、すなわち原子番号で決まる）を元素という。","◯ 二酸化炭素（CO₂）は2種類以上の原子で構成されているため化合物である。","◯ アボガドロの法則によれば、すべての気体において、同じ温度・同じ圧力のもとで、同じ体積中に含まれる分子の数は常に同じである。"]},{"id":102,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"令和2年 問2","q":"正しいものはどれか。","opts":["空気は、酸素と窒素およびその他の成分の化合物である。","分子量は、その分子を構成する原子の原子量の和である。","アボガドロの法則によれば、すべての気体において、同じ体積中に含まれる分子の数は、温度、圧力に関係なく常に同じである。","ある物質があって、その物質の固有の特性を示す最小の基本粒子を分子という。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","イ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[0,1,0,1],"ex":["✕ 空気は、酸素（約21%）、窒素（約78%）、アルゴン（約1%）およびその他の成分の混合物である（化合物ではない）。","◯ 分子量は、その分子を構成する原子の原子量の和である。","✕ アボガドロの法則によれば、同じ体積中に含まれる分子の数は、同一温度・同一圧力であれば常に同じである（温度・圧力によって異なる）。","◯ ある物質があって、その物質の固有の特性を示す最小の基本粒子を分子という。"]},{"id":91,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"令和元年 問2","q":"正しいものはどれか。","opts":["プロパンは2種類の元素からできている化合物である。","酸素1molの分子の数は、温度が上昇すると増加する。","ある物質の固有の特性を示す最小の基本粒子を原子という。","物質の状態は、臨界温度以下では、温度・圧力の変化によって、固体、液体、気体の3つの状態の間で変化する。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ハ"],"ans":2,"ok":[1,0,0,1],"ex":["◯ プロパン（C₃H₈）は2種類の元素（CとH）からできている化合物である。","✕ 酸素1molの分子の数（6.02×10²³個）は、温度が上昇しても変化しない。","✕ ある物質の固有の特性を示す最小の基本粒子は分子という。原子は分子を構成する基本単位である。","◯ 物質の状態は、臨界温度以下では、温度・圧力の変化によって固体・液体・気体の3つの状態間で変化する。"]},{"id":92,"sec":"2.3","sn":"原子・分子・元素・化合物および物質の性質","yr":"平成30年 問2","q":"正しいものはどれか。","opts":["酸素は2種類の元素からできている。","アセチレンは炭素と水素の混合物である。","原子量には単位がない。","アボガドロの法則によれば、すべての気体において、同じ温度、同じ圧力のもとで、同じ体積中に含まれる分子の数は常に同じである。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ハ、ニ"],"ans":4,"ok":[0,0,1,1],"ex":["✕ 酸素（O₂）は1種類の元素（O）からできている。","✕ アセチレン（H−C≡C−H）は、炭素（C）と水素（H）の化合物である（混合物ではない）。","◯ 原子量は炭素原子（C）に12という数値を与え、他の原子の質量はこれを基準とした無単位の数値である。","◯ アボガドロの法則によれば、すべての気体において、同じ温度・同じ圧力のもとで同じ体積中に含まれる分子の数は常に同じである。"]},{"id":93,"sec":"2.4","sn":"単位および関係用語","yr":"令和5年 問3","q":"単位などについて正しいものはどれか。","opts":["絶対圧力は、ゲージ圧力から大気圧を差し引いた圧力である。","物質1kgの温度を1K上昇させるのに必要な熱量は、それぞれの物質に固有の値となる。","標準状態（0℃、0.1013MPa）における気体のガス比重は、その気体の分子量と空気の平均分子量との比として求められる。","セルシウス温度273℃は、熱力学温度でおよそ0Kである。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 絶対圧力は、ゲージ圧力に大気圧を加えた圧力である。","◯ 物質1kgの温度を1K上昇させるのに必要な熱量は、それぞれの物質の比熱が異なるため固有の値となる。","◯ 標準状態における気体のガス比重は、その気体の分子量と空気の平均分子量との比として求められる。","✕ セルシウス温度273℃は、熱力学温度でおよそ273+273=546Kである。"]},{"id":94,"sec":"2.4","sn":"単位および関係用語","yr":"令和4年 問3","q":"単位などについて正しいものはどれか。","opts":["1Paは、物体の単位面積1m²当たりに1Nの力が垂直に作用するときの圧力を表す。","セルシウス温度（℃）は、標準大気圧下における純水の氷点を0度、沸点を100度として、その間を百等分して1度としたものである。","SI単位では、熱量の単位としてジュール（J）が用いられ、1Jは1N・mである。","SI接頭語において、ミリ（m）は10⁻³を表し、メガ（M）は10⁶を表す。"],"chs":["イ、ロ、ハ","イ、ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ","イ、ロ、ハ、ニ"],"ans":5,"ok":[1,1,1,1],"ex":["◯ 1Paは、物体の単位面積1m²当たりに1Nの力が垂直に作用するときの圧力を表す。","◯ セルシウス温度（℃）は純水の氷点を0度、沸点を100度として百等分したものである。","◯ SI単位では熱量の単位にジュール（J）が用いられ、1Jは1N・mである。","◯ SI接頭語のミリ（m）は10⁻³、メガ（M）は10⁶を表す。"]},{"id":95,"sec":"2.4","sn":"単位および関係用語","yr":"令和3年 問3","q":"単位などについて正しいものはどれか。","opts":["セルシウス温度100℃は、熱力学温度（絶対温度）でおよそ373Kである。","（力）＝（質量）×（加速度）であるので、1NはSI基本単位を用いて表すと1kg・m/s²となる。","1Paは1N/m²であり、1,000,000Paは1MPaである。","SI単位では、熱量の単位としてカロリー（cal）が用いられる。"],"chs":["イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ハ","イ、ロ、ニ"],"ans":4,"ok":[1,1,1,0],"ex":["◯ セルシウス温度100℃は、熱力学温度で表すと273を加えておよそ373K（100+273=373K）である。","◯ （力）＝（質量）×（加速度）なので、1NはSI基本単位で1kg・m/s²となる。","◯ 1Paは1N/m²であり、1,000,000Paは1MPaである。","✕ SI単位では、熱量の単位としてジュール（J）が用いられる。"]},{"id":96,"sec":"2.4","sn":"単位および関係用語","yr":"令和2年 問3","q":"単位などについて正しいものはどれか。","opts":["絶対温度290Kは、セルシウス温度でおよそ17℃である。","1m²当たり1Nの垂直な力が面に作用しているとき、その面における圧力は、1kPaである。","単位体積の物質の温度を1K上昇させるのに必要な熱量をその物質の比熱容量（比熱）という。","標準状態（0℃、0.1013MPa）の気体のガス比重は、その気体の分子量と空気の平均分子量の比として求められる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ハ、ニ","ロ、ハ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ 絶対温度290Kはセルシウス温度で290−273＝17℃である。","✕ 1m²当たり1Nの垂直な力が作用するときの圧力は1Pa（「kPa」が誤り）である。","✕ 単位質量（「単位体積」が誤り）の物質の温度を1K上昇させるのに必要な熱量を比熱容量という。","◯ 標準状態の気体のガス比重は、その気体の分子量と空気の平均分子量（約29）の比として求められる。"]},{"id":97,"sec":"2.4","sn":"単位および関係用語","yr":"令和元年 問3","q":"単位などについて正しいものはどれか。","opts":["セルシウス温度の1度の幅と、熱力学温度（絶対温度）のそれとは異なる。","絶対圧力は、ゲージ圧力から大気圧を差し引いた圧力である。","単位質量の物質の温度を1℃上昇させるのに必要な熱量をその物質の比熱容量（比熱）という。","密度の単位としてkg/m³を用いた。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","ロ、ハ、ニ"],"ans":4,"ok":[0,0,1,1],"ex":["✕ セルシウス温度（℃）の1度の幅と、熱力学温度（絶対温度：K）のそれとは同じである。","✕ 絶対圧力は、ゲージ圧力に大気圧を加えた圧力である。","◯ 単位質量の物質の温度を1℃上昇させるのに必要な熱量をその物質の比熱容量（比熱）という。","◯ 密度の単位としてkg/m³を用いる。"]},{"id":98,"sec":"2.4","sn":"単位および関係用語","yr":"平成30年 問3","q":"単位などについて正しいものはどれか。","opts":["1Nの力を質量1kgの物体に作用させると1m/s²の加速度を生じる。","1Paは物体の単位面積1cm²当たりに1Nの力が垂直に作用するときの圧力を表す。","【J/(kg・K)】という単位は、1kgの物質の温度を1K変化させるのに必要な熱量を表すときに使用される。","セルシウス温度0℃を熱力学温度（絶対温度）に換算すると、およそ−273Kとなる。"],"chs":["イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":1,"ok":[1,0,1,0],"ex":["◯ 加速度をX[m/s²]とすると1N＝1kg×Xより、X＝1m/s²となる。","✕ 1Paは、物体の単位面積1m²当たりに1Nの力が垂直に作用するときの圧力を表す（cm²ではない）。","◯ J/(kg・K)は、1kgの物質の温度を1K変化させるのに必要な熱量を表す単位である。","✕ セルシウス温度0℃を熱力学温度に換算すると、T＝273+0＝273Kとなる（−273Kではない）。"]},{"id":1,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"令和5年 問6","q":"液化ガスの性質などについて正しいものはどれか。","opts":["ガスは、その臨界温度以下であれば、標準大気圧下での沸点より高い温度領域でも、圧縮により液化することができる。","物質に出入りする熱量のうち、状態変化にだけ関わる熱量を潜熱という。","単一物質の液化ガスの沸騰が起こる温度は、液化ガスの液面に加わる圧力に関係なく一定である。","容器に充てんされた単一物質の液化ガスの蒸気圧は、容器内に液体が存在し、かつ、温度が一定であれば、液体の量の多少に関係なく一定である。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":5,"ok":[1,1,0,1],"ex":["◯ 臨界温度以下なら沸点より高温でも圧縮で液化できる。","◯ 相変化に関わる熱量＝潜熱。相変化なし＝顕熱。","✕ 沸点は液面の圧力に関係する（高圧→高沸点）。","◯ 単一物質の蒸気圧は温度のみで決まり液体量に無関係。"]},{"id":2,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"令和4年 問6","q":"正しいものはどれか。","opts":["液化ガスの沸点は、液面に加わる圧力を高くすると上昇する。","温度一定のもとで物質の状態変化（相変化）に伴い出入りする熱量を、顕熱という。","液体は、圧力一定のもとで温度が変化すると、それに応じて体積も変化する。","同一温度で蒸気圧が異なる液化ガスの混合物を密閉した容器に充てんすると、液相の組成と気相の組成は異なる。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ハ、ニ"],"ans":5,"ok":[1,0,1,1],"ex":["◯ 液面の圧力が高いほど沸点は上昇する。","✕ 相変化に伴う熱量は潜熱。顕熱は相変化なしの熱量。","◯ 液体も圧力一定で温度変化すると体積が変わる。","◯ 混合物は液相と気相で組成が異なる。"]},{"id":3,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"令和3年 問6","q":"正しいものはどれか。","opts":["ガスは、その臨界温度を超えた温度ではいくら圧力を加えても液化しない。","蒸発熱、凝縮熱のように、温度一定のまま状態変化（相変化）に伴って出入りする熱量を、総称して潜熱という。","容器に充てんされた単一物質の液化ガスの蒸気圧は、温度が一定であればその液体の充てん量が多いほど高い。","容器に混合物の液化ガスが充てんされているとき、一般に液相部の組成と気相部の組成は異なる。"],"chs":["イ、ロ","ロ、ハ","ハ、ニ","イ、ロ、ニ","イ、ハ、ニ"],"ans":4,"ok":[1,1,0,1],"ex":["◯ 臨界温度超えではいくら加圧しても液化しない。","◯ 蒸発熱・凝縮熱など相変化に伴う熱量を総称して潜熱という。","✕ 単一物質の蒸気圧は温度のみで決まり量に無関係で一定。","◯ 混合物は液相・気相で組成が異なる。"]},{"id":4,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"令和2年 問6","q":"正しいものはどれか。","opts":["一定温度の下で単一成分のガスに圧力を加えて液化を行う場合、温度はそのガスの臨界温度以下でなければならない。","液化ガス容器内の液体は、温度が変化しても体積は変化しないので、容器内に液化ガスが液体で100%満たされていても圧力上昇による危険性はない。","液化ガスの沸点は、液面に加わる圧力が高くなるほど高くなる。","物質に出入りする熱量のうち、状態変化（相変化）を伴わずに出入りする熱量を顕熱という。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ"],"ans":4,"ok":[1,0,1,1],"ex":["◯ 液化には臨界温度以下が必要。","✕ 液体も温度で体積変化する。満液状態での温度上昇は圧力急上昇の危険あり。","◯ 液面の圧力が高いほど沸点は高くなる。","◯ 相変化なしの熱量＝顕熱。相変化ありは潜熱。"]},{"id":5,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"令和元年 問6","q":"正しいものはどれか。","opts":["気体は、その臨界温度を超えた温度においても圧縮すれば液化する。","LPガスのような混合物の飽和蒸気圧は、液相の温度に加え液相の組成によっても変化する。","気体の酸素は、標準大気圧下でも沸点以下に冷却すれば液化が始まる。","温度一定のまま、物質が状態変化（相変化）するときに出入りする熱量を、顕熱という。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ハ、ニ"],"ans":4,"ok":[0,1,1,0],"ex":["✕ 臨界温度超えでは圧縮しても液化しない。","◯ 混合物の飽和蒸気圧は液相の温度と組成によって変化する。","◯ 沸点以下に冷却すれば液化する。","✕ 相変化するときの熱量は潜熱。顕熱は相変化なしのもの。"]},{"id":6,"sec":"2.7","sn":"固体・液体・気体の性質","yr":"平成30年 問6","q":"正しいものはどれか。","opts":["単一物質の液化ガスの蒸気圧は、温度が一定であればその液体の量が多いほど低くなる。","気体はその臨界温度を超えると圧縮しても液化しない。","液化ガスの沸点は、液面に加わる圧力が高くなるほど高くなる。","LPガスのように混合物の液化ガスが密閉した容器に充てんされ、液相部と気相部が存在しているときは、一般に液相部の組成と気相部の組成は同じである。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 単一物質の蒸気圧は温度のみで決まり量に無関係で一定。","◯ 臨界温度超えでは圧縮しても液化しない。","◯ 液面の圧力が高いほど沸点は高い。","✕ 混合物は液相と気相で組成が異なる（同じではない）。"]},{"id":7,"sec":"2.8","sn":"燃焼と爆発","yr":"令和5年 問7","q":"燃焼と爆発について正しいものはどれか。","opts":["アセチレン、酸化エチレン、モノゲルマンは、分解爆発性ガスである。","25℃、0.1013MPaにおける単位質量当たりの総発熱量は、水素のほうがメタンに比べて大きい。","同一の温度と圧力のもとでは、可燃性ガスと酸素との混合気体の爆発範囲（vol%）は、可燃性ガスと空気との混合気体のそれに比べて狭くなる。","断熱圧縮による温度上昇は、発火源となることはない。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ アセチレン・酸化エチレン・モノゲルマンはいずれも分解爆発性ガス。","◯ 水素（142MJ/kg）はメタン（56MJ/kg）より単位質量当たり発熱量大。","✕ 酸素との混合は空気との混合より爆発範囲が広くなる。","✕ 断熱圧縮による温度上昇は発火源となることがある。"]},{"id":8,"sec":"2.8","sn":"燃焼と爆発","yr":"令和4年 問7","q":"燃焼と爆発について正しいものはどれか。","opts":["発火点が常温以下のガスは、常温の大気中に流出すると発火する危険性があり、一般に自然発火性ガスと呼ばれている。","紫外線、レーザー光などの光も、可燃性混合ガスの発火源となることがある。","常温、0.1013MPaにおける空気中の爆発範囲（燃焼範囲）は、メタンより水素のほうが広い。","25℃、0.1013MPaにおける単位質量当たりの総発熱量は、水素よりプロパンのほうが大きい。"],"chs":["イ、ロ、ハ","イ、ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ","イ、ロ、ハ、ニ"],"ans":1,"ok":[1,1,1,0],"ex":["◯ 発火点が常温以下のガスは自然発火性ガスと呼ばれる。","◯ 紫外線・レーザー光も可燃性混合ガスの発火源になる。","◯ 水素（4〜75vol%）はメタン（5〜15vol%）より爆発範囲が広い。","✕ 単位質量当たり発熱量は水素（142MJ/kg）のほうがプロパン（50MJ/kg）より大きい。"]},{"id":9,"sec":"2.8","sn":"燃焼と爆発","yr":"令和3年 問7","q":"正しいものはどれか。","opts":["常温、0.1013MPa、空気中においては、水素ガスが爆ごうを起こす可能性のある濃度範囲（爆ごう範囲）は、その爆発範囲より狭くなる。","25℃、0.1013MPaにおいて、水素の単位体積当たりの総発熱量は、メタンのそれに比べて大きい。","発火点が常温以下のガスは、常温の大気中に流出すると発火する危険性がある。","一酸化炭素は、常温、大気圧の空気中では、燃焼、爆発することはない。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","イ、ロ、ハ","イ、ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 水素の爆ごう範囲（18.3〜59vol%）は爆発範囲（4.0〜75.0vol%）より狭い。","✕ 単位体積当たり発熱量は水素（13MJ/m³）はメタン（40MJ/m³）より小さい。","◯ 発火点が常温以下のガスは大気中流出で発火の危険あり。","✕ COは空気中で爆発範囲（12.5〜74.0vol%）があり燃焼・爆発する。"]},{"id":10,"sec":"2.8","sn":"燃焼と爆発","yr":"令和2年 問7","q":"正しいものはどれか。","opts":["水素は、常温、標準大気圧、空気中において、アセチレンより爆発範囲（燃焼範囲）が広い。","プロパンが酸素と反応して完全燃焼すると、二酸化炭素と水が生成される。","火炎の伝ば速度が可燃性混合ガス中の音速よりも大きいものを、爆ごうという。","一般に、炭化水素（気体）では、同じ温度、圧力における単位体積当たりの総発熱量は、分子量の大きなものの方が大きい。"],"chs":["イ、ハ","イ、ニ","ロ、ニ","イ、ロ、ハ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 水素（4〜75vol%）はアセチレン（2.5〜100vol%）より爆発範囲が狭い。","◯ C₃H₈+5O₂→3CO₂+4H₂O","◯ 火炎伝ば速度がガス中音速より大きいものを爆ごうという。","◯ 炭化水素は分子量大→単位体積発熱量大。"]},{"id":11,"sec":"2.8","sn":"燃焼と爆発","yr":"令和元年 問7","q":"正しいものはどれか。","opts":["断熱圧縮による昇温は、発火源とはならない。","単位質量当たりの総発熱量は、メタンに比べ水素のほうが大きい。","自然発火性ガスは、酸素や空気などの支燃物がなくても分解爆発を起こす性質をもったガスである。","水素は、常温、標準大気圧、空気中において、アセチレンより爆発範囲（燃焼範囲）が狭い。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ニ"],"ans":5,"ok":[0,1,0,1],"ex":["✕ 断熱圧縮による温度上昇は発火源となることがある。","◯ 水素（142MJ/kg）はメタン（56MJ/kg）より単位質量当たり発熱量大。","✕ 支燃物なしで分解爆発するのは分解爆発性ガス。自然発火性ガスとは別。","◯ 水素（4〜75vol%）はアセチレン（2.5〜100vol%）より爆発範囲が狭い。"]},{"id":12,"sec":"2.8","sn":"燃焼と爆発","yr":"平成30年 問7","q":"正しいものはどれか。","opts":["アセチレンは、発火源があると、支燃物がなくても分解反応によって多量の熱を発生して火炎を生じるおそれのあるガスである。","発火点が−10℃のガスであれば、20℃の大気中に流出しても発火することはない。","換気の悪い空間でブタンを燃焼させると一酸化炭素が発生することがある。","常温、標準大気圧（0.1013MPa）下において、体積の割合がプロパン30%、空気70%である混合気体は爆発範囲内にある。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ アセチレンは支燃物なしで分解爆発する分解爆発性ガス。","✕ 発火点−10℃<大気温20℃なので流出すれば発火の危険あり。","◯ 換気不良でブタン燃焼→空気不足でCO発生あり。","✕ プロパンの爆発範囲は2.1〜9.5vol%。30%は範囲外（爆発しない）。"]},{"id":13,"sec":"2.9","sn":"容器","yr":"令和5年 問8","q":"容器について正しいものはどれか。","opts":["継目なし容器の材料の一つにクロムモリブデン鋼があげられる。","溶接容器は、主として高圧の水素、窒素などの圧縮ガスを充てんするために用いられている。","継目なし容器の使用形態には、単体容器による方法、カードル（枠組容器）による方法などがある。","超低温容器は、外部からの熱の侵入を極力防ぐ措置として、内槽と外槽とで構成され、その間は断熱材が充填あるいは積層され、かつ、真空引きされている。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ"],"ans":4,"ok":[1,0,1,1],"ex":["◯ クロムモリブデン鋼は継目なし容器の材料の一つ。","✕ 溶接容器はLPガス・フルオロカーボンなど低圧液化ガスや溶解アセチレン用。","◯ 単体容器・カードル（枠組容器）などがある。","◯ 内槽と外槽の二重構造で間に断熱材充填・真空引きされている。"]},{"id":14,"sec":"2.9","sn":"容器","yr":"令和4年 問8","q":"容器について正しいものはどれか。","opts":["容器は、その構造上、継目なし容器、溶接容器、ろう付け容器、繊維強化プラスチック複合容器、超低温容器などに分類できる。","継目なし容器の主な製造方法として、マンネスマン式、エルハルト式などがある。","胴部に縦方向の溶接継手がなく、胴部に円周方向の溶接継手が一か所ある容器は、三部構成容器である。","繊維強化プラスチック複合容器（フルラップ容器）とは、厚い炭素鋼ライナーの胴部に、鋼よりも引張強さが大きく、長い繊維をすき間なく巻きつけ、エポキシ樹脂を含浸させた容器である。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 継目なし・溶接・ろう付け・FRP複合・超低温容器などに分類できる。","◯ マンネスマン式・エルハルト式などがある。","✕ 胴部に縦継手なし・円周継手一か所は二部構成容器（三部ではない）。","✕ FRP複合容器のライナーはアルミニウム合金製（炭素鋼ではない）。"]},{"id":15,"sec":"2.9","sn":"容器","yr":"令和3年 問8","q":"容器について正しいものはどれか。","opts":["溶接容器は、主として高圧の水素、窒素などの圧縮ガスを充てんするために用いられている。","繊維強化プラスチック複合容器のフルラップ容器は、鋼製継目なし容器に比べ、最高充てん圧力、内容積が同じ場合、質量は約1/2と軽量である。","アルミニウム合金は、継目なし容器、溶接容器の材料として使用されている。","継目なし容器は、二部構成または三部構成で製造されている。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":4,"ok":[0,1,1,0],"ex":["✕ 溶接容器は低圧液化ガス・溶解アセチレン用。高圧圧縮ガスは継目なし容器。","◯ FRP複合容器は鋼製継目なし容器の約1/2の質量。","◯ アルミニウム合金は継目なし容器・溶接容器の材料として使用される。","✕ 継目なし容器は溶接継手のない容器。二部・三部構成は溶接容器の話。"]},{"id":16,"sec":"2.9","sn":"容器","yr":"令和2年 問8","q":"容器について正しいものはどれか。","opts":["継目なし容器の使用形態には、単体容器による方法、カードル（枠組容器）による方法などがある。","継目なし容器の製造方法は、マンネスマン式だけである。","胴部に縦方向の溶接による継目を有し、鏡部と胴部の間に周方向の溶接による継目を有する容器は、二部構成容器である。","アルミニウム合金製ライナーの外側に、エポキシ樹脂を含浸した、鋼よりも引張強さの大きい長い繊維を巻きつけた容器は、繊維強化プラスチック（FRP）複合容器である。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ 単体・カードル（枠組容器）・集合装置方式などがある。","✕ マンネスマン式のほかエルハルト式などもある。","✕ 胴部に縦継手があり鏡板との周継手もある容器は三部構成容器。","◯ アルミ合金ライナー＋繊維巻き＋エポキシ樹脂がFRP複合容器。"]},{"id":17,"sec":"2.9","sn":"容器","yr":"令和元年 問8","q":"容器について正しいものはどれか。","opts":["ステンレス鋼製継目なし容器は、半導体製造などに使用されるガスを充てんする容器として容器内面の平滑度、清浄さ、耐食性などが要求される場合に使用される。","溶接容器は、内容積が120L未満の容器だけに用いられるものであり、タンクローリーのような大型の容器には使用されない。","炭素鋼は、溶接容器の材料として使用されている。","超低温容器は、液化酸素、液化窒素などの超低温の液化ガスを充てんするため、二重殻構造とし断熱措置を施した容器である。"],"chs":["イ、ロ","ロ、ハ","ハ、ニ","イ、ロ、ニ","イ、ハ、ニ"],"ans":5,"ok":[1,0,1,1],"ex":["◯ ステンレス鋼製継目なし容器は半導体用ガス充てんに使用される。","✕ 溶接容器はタンクローリー・トレーラ用など大型のものにも使用される。","◯ 炭素鋼は溶接容器の材料として使用される。","◯ 超低温容器は二重殻構造＋断熱措置の容器。"]},{"id":18,"sec":"2.9","sn":"容器","yr":"平成30年 問8","q":"容器について正しいものはどれか。","opts":["溶接容器には、二部構成容器はあるが、三部構成容器はない。","アルミニウム合金は、継目なし容器の材料として使用されている。","溶接容器は、主としてLPガスやフルオロカーボンなどの低圧の液化ガス用あるいは溶解アセチレン用に使用される。","救急用の空気呼吸器用容器に使用されているFRP複合容器（フルラップ容器）の質量は、最高充てん圧力、内容積が同じ場合、鋼製継目なし容器の質量に比べおよそ1/2である。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 溶接容器には二部構成と三部構成の両方ある。","◯ アルミニウム合金は継目なし容器の材料として使用される。","◯ 溶接容器は低圧液化ガスや溶解アセチレン用。","◯ FRP複合容器は鋼製継目なし容器の約1/2の質量。"]},{"id":19,"sec":"2.10","sn":"安全弁","yr":"令和元年 問9","q":"容器バルブの安全弁について正しいものはどれか。","opts":["シアン化水素、三フッ化塩素のバルブには、安全弁がついていない。","破裂板と溶栓の併用式の安全弁は、破裂板の疲労による破裂圧力の低下を防ぐため、安全弁の吹出し孔内に可溶合金を充てんして、圧力による破裂板のふくらみを抑えている。","破裂板式安全弁の破裂板の材料には、銅、ニッケルなどが使用されている。","溶解アセチレン容器の溶栓式安全弁が作動した場合、ガスの噴出方向は容器の軸心に対して直角である。"],"chs":["イ、ロ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[1,1,1,0],"ex":["◯ シアン化水素・三フッ化塩素は毒性が強く安全弁を付けない。","◯ 可溶合金充てんで破裂板ふくらみを抑えて破裂圧力低下を防ぐ。","◯ 破裂板の材料には銅・ニッケルなどが使用される。","✕ 溶栓式安全弁のガス噴出方向は軸心に対して30°以内の上向き（直角ではない）。"]},{"id":20,"sec":"2.10","sn":"安全弁","yr":"平成30年 問9","q":"容器用バルブに装着されている安全弁について正しいものはどれか。","opts":["溶栓（可溶合金、ヒューズメタル）式安全弁は、容器温度が規定温度に達した場合、可溶合金が溶融して容器内のガスを外部に放出する。","ばね（スプリング）式安全弁は、容器内圧力が上昇し、安全弁の吹始め圧力に達すると容器内のガスを外部に放出し、それによって吹止まり圧力まで容器内圧力が下がればガスの放出を停止する。","安全弁は、装着されている容器用バルブが閉のときには作動するが、開のときには作動しない。","安全弁の種類には、ばね式のほか、破裂板（ラプチャディスク）式と溶栓式があるが、破裂板と溶栓の併用式はない。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 規定温度に達するとヒューズメタルが溶融しガスを放出する。","◯ 吹始め圧力でガス放出→吹止まり圧力まで下がれば停止。","✕ 安全弁はバルブの開閉にかかわらず容器内圧力上昇時に作動する。","✕ 破裂板と溶栓の併用式もある。"]},{"id":21,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和5年 問9","q":"容器バルブについて正しいものはどれか。","opts":["容器バルブには、容器取付部と充てん口部があって、その間に弁を動かして流路を開閉する機構が設けられている。","容器取付部のねじが平行ねじのものは、アルミニウム合金の容器に使用されている場合が多い。","ヨーク形バルブは、圧力調整器を充てん口部のねじに取り付けるタイプの容器バルブである。","開閉機構部のガス漏れ防止の方式のうち、パッキン式は、金属の薄板によりガスの流入室と開閉操作室を完全に分離したものである。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 容器取付部と充てん口部があり弁で流路を開閉する機構がある。","◯ 平行ねじはアルミニウム合金容器に多く使われる。","✕ ヨーク形バルブはねじなしで枠に取り付けるタイプ。","✕ 金属薄板でガス流入室と操作室を分離するのはダイヤフラム式。"]},{"id":22,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和5年 問10","q":"容器バルブの安全弁について正しいものはどれか。","opts":["シアン化水素やニフッ化塩素の容器には、破裂板（ラプチャディスク）式安全弁が用いられている。","容器に直接安全装置があるときは、容器バルブに安全弁がなくてもよい。","溶解アセチレン容器の溶栓（可溶合金）式安全弁が作動した場合、ガスの噴出方向は容器の軸心に対して直角となる。","ばね（スプリング）式安全弁は、容器内圧力が上昇して安全弁の吹始め圧力に達すると、容器内のガスを外部に放出し、それによって容器内圧力が吹止まり圧力まで下がれば、放出を停止する。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ニ"],"ans":5,"ok":[0,1,0,1],"ex":["✕ シアン化水素・三フッ化塩素のバルブには安全弁を付けない。","◯ 容器に直接安全装置があれば容器バルブに安全弁不要。","✕ 溶栓式のガス噴出方向は軸心に対して30°以内の上向き（直角ではない）。","◯ 吹始め圧力でガス放出→吹止まり圧力まで下がれば停止。"]},{"id":23,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和4年 問9","q":"容器バルブについて正しいものはどれか。","opts":["ダイヤフラム式バルブは、ダイヤフラムによりガスの流入室と開閉操作室が完全に分離されている。","開閉機構部の気密性を保持する方式には、ダイヤフラム式のほか、パッキン式、バックシート式などがあるが、Oリング式はない。","充てん口のねじに、めねじは使用されていない。","容器取付部のねじには、テーパねじと平行ねじがある。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ ダイヤフラム（金属薄板）でガス流入室と操作室を完全分離。","✕ Oリング式もある。4種類：パッキン・バックシート・Oリング・ダイヤフラム。","✕ LPガス用充てん口にはめねじが使用される。","◯ テーパねじと平行ねじの2種類がある（多くはテーパ）。"]},{"id":24,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和4年 問10","q":"容器バルブの安全弁について正しいものはどれか。","opts":["安全弁は、容器の安全を保つため、容器バルブの開閉状態にかかわらず作動する。","安全弁の種類には、ばね式のほか、破裂板（ラプチャディスク）式と溶栓式があるが、破裂板と溶栓の併用式はない。","溶栓式安全弁は、容器温度が上昇し規定温度に達した場合に、安全弁内部の可溶合金（ヒューズメタル）が溶融して容器内のガスを放出する。","LPガス用容器バルブの安全弁は、主に破裂板（ラプチャディスク）式のものが使用されている。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ バルブの開閉にかかわらず容器内圧力上昇時に作動する。","✕ 破裂板と溶栓の併用式もある。","◯ 規定温度でヒューズメタルが溶融してガスを放出する。","✕ LPガス用はばね（スプリング）式が主に使用される。"]},{"id":25,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和3年 問9","q":"容器バルブについて正しいものはどれか。","opts":["ヨーク式バルブは、充てん口のねじに圧力調整器を取り付けるタイプの容器バルブである。","容器取付部のねじが平行ねじである容器バルブは、アルミニウム合金の容器に使用される場合が多い。","容器バルブの充てん口にはねじのあるものとないものがあり、また、そのねじの種類には、おねじとめねじがある。","容器バルブの開閉機構部のシール方式は、パッキン式、バックシート式の2種類に限られる。"],"chs":["イ、ハ","イ、ニ","ロ、ハ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ ヨーク式はねじなしで枠に取り付けるタイプ（ねじ式ではない）。","◯ 平行ねじはアルミニウム合金容器に多く使われる。","◯ 充てん口はねじあり・なしがあり、おねじとめねじの種類がある。","✕ パッキン・バックシート・Oリング・ダイヤフラムの4種類があり2種類ではない。"]},{"id":26,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和3年 問10","q":"容器バルブの安全弁について正しいものはどれか。","opts":["破裂板と溶栓の併用式安全弁は、破裂板の疲労による破裂圧力の低下を防ぐため、安全弁の吹出し孔内に可溶合金を充てんして、通常状態における圧力による破裂板のふくらみを抑えている。","破裂板式安全弁の破裂板の材料には、銅、ニッケルおよび銀などが使用されている。","シアン化水素、三フッ化塩素の容器バルブには、破裂板と溶栓の併用式安全弁が使用されている。","容器バルブに装着される安全弁は、その容器バルブが開のときには作動しない。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 可溶合金充てんで破裂板ふくらみを抑えて破裂圧力低下を防ぐ。","◯ 破裂板の材料には銅・ニッケル・銀などが使用される。","✕ シアン化水素・三フッ化塩素のバルブには安全弁を付けない。","✕ 安全弁はバルブの開閉にかかわらず作動する。"]},{"id":27,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和2年 問9","q":"容器バルブについて正しいものはどれか。","opts":["ダイヤフラム式のバルブは、金属の薄板（ダイヤフラム）によりガスの流入室と開閉操作室を完全に分離したバルブである。","ガスの流入口を開閉する弁は、弁体（バルブステム）とも呼ばれ、ハンドルなどの操作により開閉軸（スピンドル）が回転することにより上下される。","充てん口のねじにより圧力調整器を取り付けるタイプのバルブは、ヨーク式と呼ばれている。","容器取付部がテーパねじのバルブは、アルミニウム合金の容器に使用される場合が多い。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ ダイヤフラム（金属薄板）でガス流入室と操作室を完全分離。","◯ 弁体（バルブステム）ともいいスピンドルの回転で上下する。","✕ ヨーク式はねじなしで枠に取り付けるタイプ。ねじ式ではない。","✕ アルミ合金容器は平行ねじ（テーパねじではない）。"]},{"id":28,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和2年 問10","q":"容器バルブの安全弁について正しいものはどれか。","opts":["容器バルブの安全弁は、容器バルブが閉のときには作動するが、開のときには作動しない。","破裂板（ラプチャディスク）式安全弁が作動すると、容器内圧力が大気圧と同じになるまでガスが放出される。","溶栓式安全弁は、容器温度が上昇し規定温度に達した場合に、安全弁内部の可溶合金（ヒューズメタル）が溶融してガスが放出される。","LPガス用の容器バルブの安全弁には、主にばね（スプリング）式が用いられている。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 安全弁はバルブの開閉にかかわらず作動する。","◯ 破裂板式は大気圧になるまでガスを放出（途中で止まらない）。","◯ 規定温度でヒューズメタルが溶融してガスを放出する。","◯ LPガス用の安全弁は主にばね（スプリング）式。"]},{"id":29,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"令和元年 問10","q":"容器バルブについて正しいものはどれか。","opts":["ガスの入口（容器取付部）が平行ねじのものは、アルミニウム合金の容器に使用される場合が多い。","溶解アセチレン用のバルブの材料には、純銅を使用してはならない。","可燃性ガス用のバルブには、必ずハンドルがついている。","ハンドルのついていないバルブを閉める際、所定のレンチがなかったので、アームの長いレンチを使用し、通常より強く閉めた。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 平行ねじはアルミニウム合金容器に使用される場合が多い。","◯ 純銅を使うと銅アセチリドが生成するため使用禁止。","✕ 可燃性ガス用バルブにもハンドルなしのものがある。","✕ 強く閉めすぎると弁座シート損傷・ガス漏れの原因になる。"]},{"id":30,"sec":"2.11","sn":"容器用バルブ・安全弁","yr":"平成30年 問10","q":"容器バルブについて正しいものはどれか。","opts":["容器取付部（容器との接続部）が平行ねじのものは、アルミニウム合金の容器に使用される場合が多い。","開閉機構には、パッキン式、バックシート式、Oリング式などがあり、ダイヤフラム式はない。","医療用小容器用バルブや溶解アセチレン容器用バルブなどのヨーク式バルブは、充てん口にねじがない。","充てん口のねじに、めねじは使用されていない。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 平行ねじはアルミニウム合金容器に多く使われる。","✕ ダイヤフラム式もある。4種類：パッキン・バックシート・Oリング・ダイヤフラム。","◯ ヨーク式バルブは充てん口にねじがなく枠に取り付けるタイプ。","✕ LPガス用充てん口にはめねじが使用される。"]},{"id":31,"sec":"2.12","sn":"圧力調整器","yr":"令和5年 問11","q":"高圧用圧力調整器について正しいものはどれか。","opts":["高圧用圧力調整器の圧力調整ハンドルを緩めていくと弁と弁座が密着し流路が閉になる。","酸素容器バルブに取り付ける高圧用圧力調整器は、可燃性ガス用圧力調整器が誤って使用されないように、取付部のねじが左ねじとなっている。","高圧用圧力調整器を容器バルブに取り付けたあと、圧力調整器に供給されるガスの圧力が徐々に上がるように容器バルブを静かに開いた。","高圧用圧力調整器の調整圧力を所定の圧力に設定したのち、低圧圧力計の指針の上昇が続いたがそのまま使用した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ ハンドルを緩める（左回し）→小スプリングが弁を押上→弁と弁座が密着→閉。","✕ 酸素用調整器の取付ねじは右ねじ（可燃性ガス用が左ねじ）。","◯ 調整器取付後は容器バルブをゆっくり開けてガス圧を徐々に上げる。","✕ 低圧計の指針上昇継続は調整器の異常のため使用を中止する。"]},{"id":32,"sec":"2.12","sn":"圧力調整器","yr":"令和4年 問11","q":"高圧用圧力調整器の取扱いについて正しいものはどれか。","opts":["高圧用圧力調整器を容器バルブに取り付けた後、最初に圧力調整ハンドルを右に回して十分に押し込み、次に容器バルブを開けた。","容器バルブに高圧用圧力調整器を取り付ける前に、圧力調整ハンドルを緩めて圧力調整器のシート（弁座）とバルブ（弁）を閉の状態にした。","高圧用圧力調整器のシート（弁座）とバルブ（弁）の状態を閉にする操作をしたときに一次側から二次側にガスが流れ続けていたが、そのまま使用した。","容器バルブに取り付けた高圧用圧力調整器の一次側に圧力計があれば、その圧力計で容器内圧力を確認することができる。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","イ、ハ、ニ"],"ans":4,"ok":[0,1,0,1],"ex":["✕ 正しい順序は①容器バルブを開ける→②ハンドルを右回し。逆が誤り。","◯ 取付前にハンドルを緩めてシートと弁を閉の状態にしておく。","✕ 閉操作後もガスが流れ続ける場合は異常なので使用を中止する。","◯ 一次側（高圧側）の圧力計で容器内圧力を確認できる。"]},{"id":33,"sec":"2.12","sn":"圧力調整器","yr":"令和3年 問11","q":"高圧用圧力調整器について正しいものはどれか。","opts":["一般に、圧力調整器の圧力計の表示はゲージ圧力で表されている。","圧力調整器の圧力設定後、二次側（低圧側）圧力計の指針が上昇を続けていたので、その圧力調整器の使用を中止した。","圧力調整器の弁（バルブ）と弁座（シート）の状態を閉にするため、圧力調整ハンドルを左に廻して緩めた。","窒素用に長年使用していた圧力調整器を、酸素用に用いた。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ロ、ニ","イ、ロ、ハ"],"ans":5,"ok":[1,1,1,0],"ex":["◯ 圧力調整器の圧力計はゲージ圧力で表示される。","◯ 低圧計指針の上昇継続は異常→使用中止が正しい対応。","◯ ハンドルを左回し（緩める）→弁と弁座が閉になる。","✕ 窒素用調整器を酸素用に転用してはならない（可燃性パッキン等の危険）。"]},{"id":34,"sec":"2.12","sn":"圧力調整器","yr":"令和2年 問11","q":"高圧用圧力調整器（容器用）について正しいものはどれか。","opts":["調整器は、容器内の高圧ガスを使用する機器に応じた適正な圧力まで減圧し、一定の圧力で供給する器具である。","調整器を容器バルブに取り付けた後、圧力調整ハンドルを右回しで十分に押し込み、容器バルブを開けた。","容器バルブに取り付けた調整器の一次側（高圧側）に圧力計があれば、その圧力計を容器内圧力の確認に使用することができる。","酸素ガスに用いる調整器は、ガス供給側（上流側）の取付部のねじが左ねじで統一されており、可燃性ガスに用いる調整器と誤用されないようになっている。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 調整器は高圧ガスを適正圧力まで減圧し一定圧で供給する器具。","✕ 正しい順序は①容器バルブを開ける→②ハンドルを右回し（順序が逆）。","◯ 一次側（高圧側）圧力計で容器内圧力を確認できる。","✕ 酸素ガス用調整器の取付ねじは右ねじ（可燃性ガス用が左ねじ）。"]},{"id":35,"sec":"2.12","sn":"圧力調整器","yr":"令和元年 問11","q":"高圧用圧力調整器について正しいものはどれか。","opts":["容器バルブに調整器を取り付ける前に、圧力調整ハンドルを緩めてシート（弁座）とバルブ（弁）を閉の状態にした。","水素に使用していた調整器を酸素に使用した。","可燃性ガス用調整器の入口側取付けねじは、全て右ねじになっている。","調整器の圧力設定後に低圧圧力計の指針が上昇を続けている場合は、その調整器の使用をやめる。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","ロ、ハ、ニ"],"ans":2,"ok":[1,0,0,1],"ex":["◯ 取付前にハンドルを緩めてシートと弁を閉の状態にする。","✕ 水素用（左ねじ）は酸素用（右ねじ）に転用できない。","✕ アンモニア（可燃性）は例外で右ねじ。「全て」が誤り。","◯ 低圧計指針の上昇継続は異常→使用をやめる。"]},{"id":36,"sec":"2.12","sn":"圧力調整器","yr":"平成30年 問11","q":"高圧用の圧力調整器について正しいものはどれか。","opts":["圧力調整ハンドルを反時計回りに回して緩めることにより、弁（バルブ）と弁座（シート）の状態が開になる。","圧力調整器の弁と弁座の状態を閉にしたが、一次側（高圧側）から二次側にガスが流れていたので、その調整器の使用をやめて交換した。","容器バルブに取り付けた圧力調整器の一次側に圧力計があれば、その圧力計を容器内圧力の確認に使用することができる。","圧力調整器を容器バルブへ取り付けるためのねじは、酸素ガス用では左ねじ、可燃性ガス用では右ねじで統一されている。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ハ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 反時計回り（緩める）で弁と弁座は「閉」になる（開ではない）。","◯ 閉操作後もガスが流れ続ける場合は使用をやめて交換する。","◯ 一次側（高圧側）圧力計で容器内圧力を確認できる。","✕ 酸素ガス用は右ねじ、可燃性ガス用は一般に左ねじ（逆）。"]},{"id":37,"sec":"2.13","sn":"圧力計","yr":"令和4年 問12","q":"圧力計について正しいものはどれか。","opts":["大気圧をゼロとしている圧力計の示す値は、ゲージ圧力である。","マノメータは、低圧のガスの圧力測定に用いられる。","マノメータは、ガス圧液面と大気圧液面との高低差からガスの絶対圧力を測定することができる。","歪ゲージを用いたデジタル表示圧力計は、ブルドン管圧力計と比較して振動や衝撃の影響を受けにくい。"],"chs":["イ、ハ","イ、ニ","ロ、ハ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":4,"ok":[1,1,0,1],"ex":["◯ 大気圧をゼロとする圧力計の示す値はゲージ圧力。","◯ マノメータは低圧のガスの圧力測定に用いる。","✕ マノメータはゲージ圧力（大気圧との差）のみ。絶対圧力は測定不可。","◯ 歪ゲージ式デジタル圧力計は振動・衝撃の影響を受けにくい。"]},{"id":38,"sec":"2.13","sn":"圧力計","yr":"令和2年 問12","q":"圧力計について正しいものはどれか。","opts":["目盛板上の表示が大気圧をゼロとしている圧力計の示す値は、ゲージ圧力である。","マノメータは、水などの液柱の高さで圧力を検知するもので、低圧のガスの圧力測定に用いられる。","歪ゲージを用いたデジタル表示圧力計は、可動部分がなく、ブルドン管圧力計と比較して振動や衝撃の影響を受けにくい。","ブルドン管圧力計は、使用圧力範囲内であれば、ブルドン管の材質に関係なくすべてのガスに使用できる。"],"chs":["イ、ロ","ロ、ニ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ"],"ans":4,"ok":[1,1,1,0],"ex":["◯ 大気圧をゼロとする圧力計の値はゲージ圧力。","◯ マノメータは液柱の高さで低圧ガスの圧力を検知する。","◯ 歪ゲージ式は可動部なく振動・衝撃に強い。","✕ ブルドン管の材質によりガスに制限あり（例：アセチレン用は銅含有量62%以上不可）。"]},{"id":39,"sec":"2.13","sn":"圧力計","yr":"令和元年 問12","q":"圧力計について正しいものはどれか。","opts":["マノメータを用いると、ガス側液面と大気側液面との高低差から絶対圧力を読み取ることができる。","マノメータには、U字管のものと単管のものとがある。","ブルドン管圧力計は、断面がだ円形または平円形の中空の管を円弧状に曲げたブルドン管を利用し、ガスの圧力により管が変形したときの変位を拡大して表示する機構がとられている。","歪ゲージを用いたデジタル表示圧力計の利点の一つに過負荷に対する耐性がある。"],"chs":["イ、ハ","イ、ニ","ロ、ハ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ マノメータはゲージ圧力のみ。絶対圧力は読み取れない。","◯ U字管と単管の2種類がある。","◯ ブルドン管（断面だ円形・平円形）の変位を拡大して表示する機構。","◯ 歪ゲージ式は過負荷耐性が高い（他に可動部なし・耐久性など）。"]},{"id":40,"sec":"2.14","sn":"計測計","yr":"令和5年 問12","q":"液面計・圧力計について正しいものはどれか。","opts":["液面計は、液化ガスの貯槽などに設け、液位を測定することによって、貯蔵量、受入量、払出量の確認などの管理に用いられる。","差圧式液面計は、液面に浮かべたフロートの上下動を金属テープなどを介して指示計に伝えることにより液面の高さを知るものである。","歪ゲージを用いたデジタル表示圧力計は、ブルドン管圧力計と比較して振動や衝撃の影響を受けやすい。","腐食性のガスに用いるブルドン管圧力計のブルドン管は、それぞれのガスに応じた耐食性の材料が用いられる。"],"chs":["ハ","イ、ロ","イ、ハ","イ、ニ","ロ、ニ"],"ans":4,"ok":[1,0,0,1],"ex":["◯ 液面計は貯蔵量・受入量・払出量の管理に用いる。","✕ フロートの上下動を指示計に伝えるのはフロート液面計。差圧式は底部の圧力を測定。","✕ 歪ゲージ式は振動・衝撃の影響を受けにくい（「受けやすい」が誤り）。","◯ 腐食性ガス用ブルドン管はガスに応じた耐食性材料を使用する。"]},{"id":41,"sec":"2.14","sn":"計測計","yr":"令和5年 問13","q":"温度計・流量計について正しいものはどれか。","opts":["ガラス製温度計は、液体の体積が温度により変化することを利用した温度計である。","熱電温度計は、熱起電力を利用した温度計である。","オリフィスメータは、差圧式流量計に分類される。","容積式流量計は、流体の流れる管内にベンチュリ管を挿入して流量を測定するものである。"],"chs":["イ、ロ","ロ、ハ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ"],"ans":4,"ok":[1,1,1,0],"ex":["◯ ガラス製温度計は液体の体積変化を利用した温度計。","◯ 熱電温度計は熱起電力を利用した温度計。","◯ オリフィスメータは差圧式流量計に分類される。","✕ 管内にベンチュリ管を挿入して流量測定するのは差圧式流量計。容積式は升（ます）方式。"]},{"id":42,"sec":"2.14","sn":"計測計","yr":"令和4年 問13","q":"温度計・流量計・液面計について正しいものはどれか。","opts":["抵抗温度計は、温度が上がると金属の電気抵抗が増大することを利用したものである。","流量計は、測定原理の違いにより、容積式流量計、差圧式流量計などがあり、ベンチュリメータは、容積式流量計に分類される。","オリフィスメータは、差圧式流量計に分類される。","平形ガラス液面計は、クリンガー式液面計ともいわれ、反射式と透視式がある。"],"chs":["イ、ロ","ロ、ニ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ"],"ans":5,"ok":[1,0,1,1],"ex":["◯ 抵抗温度計は金属の電気抵抗の増大を利用する。","✕ ベンチュリメータは差圧式流量計（容積式ではない）。","◯ オリフィスメータは差圧式流量計。","◯ 平形ガラス液面計はクリンガー式ともいわれ反射式と透視式がある。"]},{"id":43,"sec":"2.14","sn":"計測計","yr":"令和3年 問12","q":"圧力計・液面計について正しいものはどれか。","opts":["ブルドン管圧力計は、ガスの圧力によるブルドン管の変位（変形量）を拡大して表示する機構を有している。","歪ゲージを用いたデジタル表示圧力計の利点の１つとして、過負荷に対する耐性がある。","丸形ガラス管液面計は、クリンガー式液面計ともいわれ、反射式と透視式がある。","差圧式液面計は、液面に浮かべたフロートの上下動を金属テープなどを介して指示計に伝えることにより液面の高さを知るものである。"],"chs":["イ、ロ","イ、ニ","ハ、ニ","イ、ロ、ハ","ロ、ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ ブルドン管の変位を拡大表示する機構がある。","◯ 歪ゲージ式は過負荷に対する耐性がある。","✕ クリンガー式とも呼ばれ反射式・透視式があるのは平形ガラス液面計（丸形ではない）。","✕ フロートの上下動で液面高さを知るのはフロート液面計。差圧式は底部圧力測定。"]},{"id":44,"sec":"2.14","sn":"計測計","yr":"令和3年 問13","q":"温度計・流量計について正しいものはどれか。","opts":["熱電温度計は、金属の電気抵抗が温度により変化することを利用している。","ガラス製温度計は、液体の体積が温度により変化することを利用している。","流量計は、測定原理の違いにより、容積式流量計、差圧式流量計、面積式流量計などがある。","ベンチュリメータは、差圧式流量計に分類される。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ハ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 電気抵抗変化を利用するのは抵抗温度計。熱電温度計は熱起電力を利用。","◯ ガラス製温度計は液体の体積変化を利用。","◯ 容積式・差圧式・面積式などがある。","◯ ベンチュリメータは差圧式流量計。"]},{"id":45,"sec":"2.14","sn":"計測計","yr":"令和2年 問13","q":"温度計・流量計・液面計について正しいものはどれか。","opts":["抵抗温度計は、熱起電力を利用して温度を測定するものである。","容積式流量計には、回転子の形状により、オーバル形、スパイラル形、ルーツ形などがある。","ベンチュリメータは、面積式流量計である。","液面計には、平形ガラス液面計、フロート液面計、差圧式液面計などがある。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ニ"],"ans":5,"ok":[0,1,0,1],"ex":["✕ 熱起電力を利用するのは熱電温度計。抵抗温度計は電気抵抗変化を利用。","◯ 容積式はオーバル形・スパイラル形・ルーツ形などがある。","✕ ベンチュリメータは差圧式（面積式ではない）。","◯ 平形ガラス液面計・フロート液面計・差圧式液面計などがある。"]},{"id":46,"sec":"2.14","sn":"計測計","yr":"令和元年 問13","q":"液面計・温度計・流量計について正しいものはどれか。","opts":["フロート液面計は、低温液化ガス貯槽などの底部にかかる液化ガスの圧力を測定して、液面の高さを知るものである。","ガラス製温度計は、液体の体積が温度により変化することを利用した温度計である。","容積式流量計には、回転子の形状により、オーバル形、スパイラル形、ルーツ形などがある。","オリフィスメータは、面積式流量計である。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","イ、ハ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 底部の圧力で液面高さを知るのは差圧式液面計。フロート液面計はフロートの上下動を使う。","◯ ガラス製温度計は液体の体積変化を利用。","◯ 容積式はオーバル形・スパイラル形・ルーツ形などがある。","✕ オリフィスメータは差圧式流量計（面積式ではない）。"]},{"id":47,"sec":"2.14","sn":"計測計","yr":"平成30年 問12","q":"保安機器・設備について正しいものはどれか。","opts":["マノメータは、液柱の高さで圧力を測定するもので、低圧のガスに用いられる。","抵抗温度計は、熱起電力を利用して温度を測定する。","ベンチュリメータは、面積式流量計である。","ガス漏えい検知警報設備は、検知素子を用いてガス濃度を測定し、警報を発する設備である。"],"chs":["イ","イ、ロ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ マノメータは液柱の高さで低圧ガスの圧力を測定する。","✕ 熱起電力を利用するのは熱電温度計。抵抗温度計は電気抵抗変化を利用。","✕ ベンチュリメータは差圧式流量計（面積式ではない）。","◯ ガス漏えい検知警報設備は検知素子でガス濃度測定し警報を発する。"]},{"id":48,"sec":"2.15","sn":"消費形態・付帯設備","yr":"令和5年 問14","q":"高圧ガスの消費に関する形態・付帯設備について正しいものはどれか。","opts":["圧縮ガスの単体容器による供給においてガスの消費量が増加したので、集合装置による方式（マニホールド方式）に変更した。","大型長尺容器を複数本枠組みして車両に固定したものは、液化ガスを全容器に安全に均一に充てんすることができるので液化ガスの大量消費に適している。","超低温容器は、低温の液化ガスを長期間貯蔵しても侵入熱による自然蒸発（圧力上昇）を起こさずガスの損失がない。","温水を熱媒体とする蒸発器の熱交換器には、一般的に蛇管式（シェルアンドコイル式）が用いられるが、ほかに二重管式、多管式なども用いられる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ 消費量増加の際は集合装置（マニホールド）方式への変更が適切。","✕ 大型長尺容器は圧縮ガスの大量消費用（液化ガスではない）。","✕ 超低温容器でも長期貯蔵で必ず侵入熱による自然蒸発が起こる。","◯ 温水熱媒体の蒸発器には蛇管式（シェルアンドコイル式）が一般的。"]},{"id":49,"sec":"2.15","sn":"消費形態・付帯設備","yr":"令和4年 問14","q":"高圧ガスの消費に関する形態・付帯設備について正しいものはどれか。","opts":["消費量が単体容器による場合よりも多いアセチレンの供給に、集合装置による方式（マニホールド方式）は適していない。","大型長尺容器を枠組みして車両に固定したものは、圧縮ガスの大量消費に対する供給用に適している。","スターフィンチューブは、大気を熱源とする気化装置の熱交換器には適していない。","2段式圧力調整器、パイロット式圧力調整器は、圧力調整器の二次圧力の変動を小さくすることに適している。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":4,"ok":[0,1,0,1],"ex":["✕ 消費量が多いアセチレンの供給にはマニホールド方式が適している。","◯ 大型長尺容器は圧縮ガスの大量消費に適している。","✕ スターフィンチューブは大気を熱源とする気化装置の熱交換器に適している。","◯ 2段式・パイロット式は二次圧力の変動を小さくするのに適している。"]},{"id":50,"sec":"2.15","sn":"消費形態・付帯設備","yr":"令和3年 問14","q":"高圧ガスの消費に関する形態・付帯設備について正しいものはどれか。","opts":["消費量が多いアセチレンの供給に、集合装置による方法を用いた。","温水を熱媒体とする蒸発器（気化器）の熱交換器には、主にスターフィンチューブが用いられている。","特殊高圧ガスを収納するシリンダーキャビネットには、内部をのぞくための窓やガス漏えい検知警報設備などが設けられている。","超低温容器は、低温の液化ガスを長期間貯蔵しても侵入熱による自然蒸発を起こさないので、その液化ガスを損失なく貯蔵できる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 消費量が多いアセチレンの供給に集合装置（マニホールド方式）は適切。","✕ 温水熱媒体の蒸発器には蛇管式（シェルアンドコイル式）。スターフィンチューブは大気熱源用。","◯ シリンダーキャビネットには内部観察窓・ガス漏えい検知設備などがある。","✕ 超低温容器でも長期貯蔵で必ず自然蒸発（侵入熱）が起こる。"]},{"id":51,"sec":"2.15","sn":"消費形態・付帯設備","yr":"令和2年 問14","q":"高圧ガスの消費の形態および消費のための付帯設備について正しいものはどれか。","opts":["アセチレンは、単体容器により供給できる量よりも消費量が多くなる場合は、集合装置による方法（マニホールド方式）で供給される。","スターフィンチューブは、大気を熱源とする気化装置の熱交換器に用いられる。","CE（コールドエバポレータ）は、外気から貯槽への侵入熱により、内部に貯蔵しているガスの一部を気化し、貯槽の内部圧力を一定に保ちながら液化ガスを送り出すものである。","二次圧力の変動をより少なくする減圧装置としては、一段式圧力調整器が適している。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ アセチレン消費量超過時はマニホールド方式で供給する。","◯ スターフィンチューブは大気熱源の気化装置の熱交換器に用いる。","✕ CEは外気との温度差を利用する加圧蒸発器方式（侵入熱だけではない）。","✕ 二次圧力変動を少なくするには二段式圧力調整器が適している。"]},{"id":52,"sec":"2.15","sn":"消費形態・付帯設備","yr":"令和元年 問14","q":"高圧ガスの消費に関する形態・付帯設備について正しいものはどれか。","opts":["圧縮ガスの供給において、ガスの消費量が増加したので、単体容器による方法から集合装置による方法（マニホールド方式）に変更した。","温水を熱媒体とする蒸発器の熱交換器としては、蛇管式（シェルアンドコイル式）が一般的に用いられる。","CE（コールドエバポレータ）方式は、炭酸ガスの供給には用いられない。","大型長尺容器を複数本枠組みして車両に固定したものは、液化ガスの大量消費に対する供給用に適している。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 消費量増加→マニホールド方式への変更は適切。","◯ 温水熱媒体には蛇管式（シェルアンドコイル式）が一般的。","✕ CE方式は炭酸ガスの供給にも用いられる。","✕ 大型長尺容器は圧縮ガス用（液化ガスではない）。"]},{"id":53,"sec":"2.15","sn":"消費形態・付帯設備","yr":"平成30年 問14","q":"高圧ガスの消費に関する形態・廃棄について正しいものはどれか。","opts":["CE（コールドエバポレータ）方式は、内部に貯蔵している低温の液化ガスの一部を気化させる加圧蒸発器により、貯槽の圧力を一定に保って液化ガスを送りだす。","消費量が多いアセチレンの供給に、集合装置による方法（マニホールド方式）は適していない。","容器収納筒（デバルバー）は、毒性ガスが漏えいしている容器や腐食してガス名の判別できない容器などを内部に収納し、専門の業者によって安全に処理するためのものである。","酸素の廃棄に使用する器具には、発火事故の原因となる可燃性のパッキンやガスケットなどは用いない。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ"],"ans":4,"ok":[1,0,1,1],"ex":["◯ CE方式は加圧蒸発器で貯槽の圧力を一定に保ち液化ガスを送り出す。","✕ 消費量が多いアセチレンにはマニホールド方式が適している。","◯ デバルバーは危険容器を収納して専門業者が安全処理するもの。","◯ 酸素廃棄用器具には可燃性パッキン・ガスケットを用いない。"]},{"id":54,"sec":"2.16","sn":"高圧ガスの取扱","yr":"令和5年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["アセチレンを消費するときに、その容器を立てて転倒防止措置を講じて使用した。","不燃性ガスに使用した圧力調整器の設定圧力が同じだったので、そのまま酸素に転用した。","使用済みの容器は、必ず容器バルブを閉止し、容器バルブ保護用のキャップを取り付けておく。","容器に圧力調整器を取り付けて使用するときは、圧力調整ハンドルが設定圧力に対応した所定の位置まで締め込まれていることを確認したのち、容器バルブを静かに開ける。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ アセチレン容器は溶解状態のため必ず立てて転倒防止措置を講じる。","✕ 不燃性ガス用調整器をそのまま酸素用に転用してはならない。","◯ 使用済み容器はバルブを閉止しキャップを取り付ける。","✕ 取付後はハンドルを緩めた（弁を閉の）状態で容器バルブを静かに開ける。"]},{"id":55,"sec":"2.16","sn":"高圧ガスの取扱","yr":"令和4年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["水素配管の気密試験にヘリウムを使用した。","ヘリウム配管の気密試験にヘリウムを使用した。","不燃性ガスに使用した圧力調整器を酸素用にそのまま流用した。","液化窒素の配管に炭素鋼鋼管を使用した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 水素配管の気密試験には不活性ガス（ヘリウム）を使用する。","◯ ヘリウム配管の気密試験にはヘリウムを使用する。","✕ 不燃性ガス用調整器を酸素用にそのまま転用してはならない。","✕ 液化窒素（沸点−196℃）配管には炭素鋼は使用しない。18-8ステンレス鋼を使用する。"]},{"id":56,"sec":"2.16","sn":"高圧ガスの取扱","yr":"令和3年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["アセチレン容器を横置きにして歯止めをして使用した。","毒性ガスは、刺激臭があり、微量の漏えいでも容易に確認することができる。","窒素を水素配管の内部清掃（吹かし）に使用した。","容器内では大気と同じ温度の液化ガスであっても、大気中に放出すると低温になるので、液化ガスの放出時には凍傷に注意する。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":5,"ok":[0,0,1,1],"ex":["✕ アセチレン容器は必ず立てて使用（横置き禁止）。","✕ COのように刺激臭のない毒性ガスもある。微量の漏れに気付かないことも。","◯ 窒素（不活性ガス）は水素配管の吹かしに使用できる。","◯ 液化ガスを大気に放出すると蒸発熱を奪い低温になる→凍傷注意。"]},{"id":57,"sec":"2.16","sn":"高圧ガスの取扱","yr":"令和2年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["窒素を水素配管の内部清掃（吹かし）に使用した。","ブルドン管圧力計が附属している圧力調整器を容器に取り付けて高圧ガスを消費する際、圧力計の正面の目盛板に顔を近づけ、指針を見ながら容器バルブを静かに開いた。","液化酸素の配管に銅管を使用した。","ガスが漏えいし着火した場合は、容器または貯槽のバルブを閉止してガスの漏えいを止めてから、消火器で消火する。ただし、消火しなければバルブの操作ができないときは、消火してから速やかにバルブを閉止する。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ロ、ニ","イ、ハ、ニ"],"ans":5,"ok":[1,0,1,1],"ex":["◯ 窒素（不活性ガス）は水素配管の吹かしに使用できる。","✕ 圧力計正面に顔を近づけないようにして指針を見る（破損時の安全対策）。","◯ 液化酸素の配管には銅管を使用できる。","◯ 着火時はまずバルブ閉止→消火。消火不能なら消火してからバルブ閉止。"]},{"id":58,"sec":"2.16","sn":"高圧ガスの取扱","yr":"令和元年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["使用済み容器（ガスの使用が済んだ容器）は、必ず容器バルブを閉じバルブ保護キャップを取り外しておく。","水素は、漏えいすると発火燃焼の危険性はあるが、毒性はないので高濃度のガスを吸入しても人体に危険はない。","付近で火災が発生したので、延焼のおそれのない容器に、放射熱による温度上昇を防止するため、注水冷却した。","ヘリウム配管の気密試験にヘリウムを使用した。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":5,"ok":[0,0,1,1],"ex":["✕ 使用済み容器は残圧を残しバルブを閉じキャップを「取り付ける」（取り外しではない）。","✕ 水素は無毒だが高濃度吸入で酸素欠乏による窒息の危険がある。","◯ 延焼のおそれのない容器の温度上昇防止に注水冷却は適切。","◯ ヘリウム配管の気密試験にはヘリウムを使用できる。"]},{"id":59,"sec":"2.16","sn":"高圧ガスの取扱","yr":"平成30年 問13","q":"高圧ガスの販売・充てん・移動について正しいものはどれか。","opts":["販売の形態には、充てん容器による販売、タンクローリーなどによる販売、導管による販売などがある。","高圧ガスを販売業者が所有する容器により販売する場合は、販売業者は、使用済み容器が返却されずに放置されることのないように、帳簿によって十分な容器管理を行わなければならない。","誤って、規定された充てん量を超えて容器に液化ガスを充てんしてしまうと、容器の温度が上昇した場合、液膨張により容器内が液で満たされ圧力が急激に上昇することがある。","内容積47Lの継目なし容器に容器バルブを保護するためのキャップを装着したので、容器を胴部が地盤面に接するように倒し、転がして移動した。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":5,"ok":[1,1,1,0],"ex":["◯ 充てん容器・タンクローリー・導管などによる販売形態がある。","◯ 使用済み容器が放置されないよう帳簿で容器管理する必要がある。","◯ 充てん量超過→温度上昇→液膨張→圧力急上昇の危険がある。","✕ 容器は底の縁で転がすかボンベキャリー使用。胴部を地面に接して転がしてはならない。"]},{"id":60,"sec":"2.16","sn":"高圧ガスの取扱","yr":"平成30年 問15","q":"高圧ガスの取扱いなどについて正しいものはどれか。","opts":["液化窒素を取り扱う際、専用の革手袋と保護めがねを使用した。","ヘリウムを水素配管の気密試験に使用した。","アセチレン容器を横置きにして歯止めを施し、使用した。","毒性ガスには刺激臭があるため、微量の漏えいでも容易に気付くことができる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 液化窒素取扱いには専用革手袋・保護めがねを使用する。","◯ 水素配管の気密試験には不活性ガス（ヘリウム等）を使用する。","✕ アセチレン容器は必ず立てて使用（横置き禁止）。","✕ COのように刺激臭のない毒性ガスもある。"]},{"id":61,"sec":"2.17.1","sn":"酸素","yr":"令和5年 問16","q":"酸素について正しいものはどれか。","opts":["気体は、同一の温度、圧力、体積において空気よりわずかに重く、無色、無臭である。","支燃性であり、液化酸素だけでも衝撃を与えると燃焼する。","同一の可燃性ガスを標準状態のもとで燃焼させるとき、空気中より酸素中のほうが、発火温度は高くなる。","化学的に非常に活性があり、空気中では燃焼しない物質でも、酸素中では燃焼することがある。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ O₂（分子量32）は空気（分子量29）よりわずかに重く、無色・無臭。","✕ 液化酸素だけでは燃焼しない。燃焼には可燃物が必要。","✕ 酸素中では発火温度は低くなる（燃えやすくなる）。","◯ 酸素は活性が高く、空気中で燃えない物質も酸素中では燃えることがある。"]},{"id":62,"sec":"2.17.1","sn":"酸素","yr":"令和4年 問16","q":"酸素について正しいものはどれか。","opts":["可燃性ガスを燃焼させるとき、空気に酸素を加え酸素の割合を大きくすると、発火温度は高くなる。","液化酸素の配管材料に、アルミニウム合金を使用した。","未使用で「禁油」の表示があるブルドン管圧力計を酸素設備に取り付けた。","作業環境中の酸素濃度が空気中の酸素濃度に比べて低いときには酸素欠乏症の危険があるが、高いときには人体に悪影響を及ぼすことはない。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 酸素割合増加→発火温度は低くなる（「高くなる」が誤り）。","◯ 液化酸素の配管にはアルミニウム合金（銅・18-8ステンレス鋼も可）が使用できる。","◯ 未使用で「禁油」表示のあるブルドン管圧力計は酸素設備に取り付け可能。","✕ 酸素濃度が高くても酸素中毒などの悪影響がある（「ない」が誤り）。"]},{"id":63,"sec":"2.17.1","sn":"酸素","yr":"令和3年 問16","q":"酸素について正しいものはどれか。","opts":["気体は、無色、無臭で、同一圧力、温度、体積において空気より軽い。","液化酸素の配管に銅管を使用した。","支燃性で、また、液化酸素だけでも燃焼する。","同一の可燃性ガスを燃焼させるとき、空気中より酸素中のほうが、爆発範囲は広くなり、発火に必要なエネルギーの最小値は小さくなる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":4,"ok":[0,1,0,1],"ex":["✕ O₂（分子量32）は空気（分子量29）より重い（「軽い」が誤り）。","◯ 液化酸素の配管には銅管（アルミ合金・18-8ステンレス鋼も可）が使用できる。","✕ 液化酸素だけでは燃焼しない（可燃物が必要）。","◯ 酸素中では爆発範囲が広くなり、最小発火エネルギーが小さくなる。"]},{"id":64,"sec":"2.17.1","sn":"酸素","yr":"令和2年 問16","q":"酸素について正しいものはどれか。","opts":["爆発範囲内にある可燃性混合ガスに局部的にエネルギーを与えることにより発火させることができる。これに必要な最小エネルギーは、空気中より酸素中の方が小さくなる。","空気中に体積でおよそ21%含まれ、気体は淡青色で無臭である。","液化酸素が充てんされている超低温容器内の残液量は、容器内の圧力からボイル・シャルルの法則により計算できる。","酸素ガスに使用する圧力計を購入する際、禁油の表示があるブルドン管圧力計を選定した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ 酸素中での最小発火エネルギーは空気中より小さい（燃えやすい）。","✕ 気体酸素は無色・無臭（淡青色は液体酸素）。","✕ ボイル・シャルルの法則は圧縮ガスのみ。液化ガスの残液量計算には不適。","◯ 酸素ガス用圧力計には「禁油」表示のあるものを選定する。"]},{"id":65,"sec":"2.17.1","sn":"酸素","yr":"令和元年 問16","q":"酸素について正しいものはどれか。","opts":["気体は無色、無臭で、同一圧力、温度、体積において空気よりわずかに重く、沸点は標準大気圧下で−183.0℃である。","支燃性で、着火源があれば酸素だけでも燃焼する。","酸素設備に使用する圧力計に、「禁油」の表示があるブルドン管圧力計を用いた。","可燃性ガスを燃焼させるとき、空気に酸素を加え酸素の割合を大きくすると、爆発範囲（燃焼範囲）は広くなり発火温度は高くなる。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 酸素は無色・無臭・空気よりわずかに重い・沸点−183℃。","✕ 支燃性だが酸素だけでは燃焼しない（可燃物が必要）。","◯ 酸素設備の圧力計は「禁油」表示のものを使用する。","✕ 酸素割合増加→爆発範囲は広くなる・発火温度は低くなる（「高くなる」が誤り）。"]},{"id":66,"sec":"2.17.1","sn":"酸素","yr":"平成30年 問16","q":"酸素について正しいものはどれか。","opts":["可燃性ガスを燃焼させるとき、空気に酸素を加え酸素の割合を大きくすると火炎温度、発火温度ともに上昇する。","作業環境中の酸素の濃度が低いときは酸素欠乏症に注意する必要があるが、酸素の濃度が高いときは人体に対する影響に注意する必要はない。","酸素は支燃性であるため、酸素だけでは燃焼も爆発も起こらない。","液化酸素の配管に銅管を使用した。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":5,"ok":[0,0,1,1],"ex":["✕ 酸素割合増加→火炎温度は上昇するが発火温度は低下する。","✕ 酸素高濃度でも酸素中毒などの悪影響がある。","◯ 酸素だけでは燃焼も爆発も起こらない（支燃性）。","◯ 液化酸素の配管には銅管を使用できる。"]},{"id":67,"sec":"2.17.2","sn":"可燃性ガス","yr":"令和5年 問17","q":"可燃性ガスについて正しいものはどれか。","opts":["水素が空気中で燃焼するとき、炎はほとんど無色で、水のみを生成する。","水素とアセチレンの爆発範囲（vol%；常温、大気圧、空気中）を比較すると、水素のほうがアセチレンより広い。","気体のメタンは、同一の温度、圧力、体積において空気より軽く、無色、無臭である。","溶解アセチレンは、容器に蔵した多孔質物に浸漬させたアセトンまたはジメチルホルムアミドの溶剤に加圧し溶解させたものである。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":5,"ok":[0,0,1,1],"ex":["✕ 問題文のイは誤り（水素燃焼の記述に誤りあり）。正しくは水素燃焼→水のみ生成、炎はほぼ無色。","✕ アセチレン（2.5〜100vol%）の方が水素（4〜75vol%）より爆発範囲が広い。","◯ メタン（CH₄：分子量16）は空気より軽く、無色・無臭。","◯ 溶解アセチレンは多孔質物に浸漬させた溶剤にアセチレンを加圧溶解したもの。"]},{"id":68,"sec":"2.17.2","sn":"可燃性ガス","yr":"令和4年 問17","q":"可燃性ガスについて正しいものはどれか。","opts":["アセチレンは、可燃性、分解爆発性のガスである。","アセチレンは、鉄と反応して、爆発性化合物のアセチリドを生成する。","水素は、高温の状態で金属の酸化物、塩化物に作用すると、金属を遊離する。","メタンと水素は、空気中で完全燃焼するといずれも水と二酸化炭素を生成する。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ アセチレンは可燃性・分解爆発性のガス。","✕ アセチリドを生成するのは銅や銀と反応した場合（鉄は生成しない）。","◯ 水素は高温で金属酸化物・塩化物を還元し金属を遊離する。","✕ 水素（H₂）は炭素を含まないため完全燃焼で水のみ生成（CO₂は生成しない）。"]},{"id":69,"sec":"2.17.2","sn":"可燃性ガス","yr":"令和3年 問17","q":"可燃性ガスについて正しいものはどれか。","opts":["水素は、空気中で燃焼するとき、炎はほとんど無色で、水と窒素を生成する。","アセチレンと水素で爆発範囲（常温、0.1013MPa、空気中）を比較すると、アセチレンのほうが広い。","メタンとアセチレンは、酸素と反応して完全燃焼すると、いずれも水と二酸化炭素を生成する。","アセチレンの配管に銀ろうで溶接した銅管を使用した。"],"chs":["イ、ハ","イ、ニ","ロ、ハ","ロ、ニ","イ、ロ、ハ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 水素燃焼で生成するのは水のみ（窒素は生成しない）。","◯ アセチレン（2.5〜100vol%）は水素（4〜75vol%）より爆発範囲が広い。","◯ CH₄もC₂H₂も酸素と完全燃焼→水と二酸化炭素。","✕ アセチレンは銅・銀と反応してアセチリドを生成するため、銀ろうの銅管は使用禁止。"]},{"id":70,"sec":"2.17.2","sn":"可燃性ガス","yr":"令和2年 問17","q":"可燃性ガスについて正しいものはどれか。","opts":["アセチレンは、自然発火性のガスである。","アセチレンは、鉄と反応して爆発性化合物であるアセチリドを生成する。","気体のメタンは、同一圧力、温度、体積において空気より軽く、無色で無臭である。","水素を酸素・水素バーナで燃焼させると、2,000℃を超える火炎温度を得ることができる。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":5,"ok":[0,0,1,1],"ex":["✕ アセチレンは自然発火性ではなく分解爆発性のガス。","✕ アセチリドを生成するのは銅・銀との反応（鉄とは生成しない）。","◯ メタン（分子量16）は空気（分子量29）より軽く、無色・無臭。","◯ 酸素・水素バーナで燃焼させると2,000℃を超える火炎温度が得られる。"]},{"id":71,"sec":"2.17.2","sn":"可燃性ガス","yr":"令和元年 問17","q":"可燃性ガスについて正しいものはどれか。","opts":["溶解アセチレンは、容器内部の多孔質物に浸潤させたアセトンまたはジメチルホルムアミド（溶剤）にアセチレンを加圧溶解したものである。","アセチレンが完全燃焼すると、水と二酸化炭素を生成し、高温度を発生する。","水素は、常温、大気圧下で炭素鋼中に侵入し、脱炭作用により炭素鋼を脆化させる。","気体のメタンは、無色、無臭で、同一圧力、温度、体積において空気より軽い。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":4,"ok":[0,1,0,1],"ex":["✕ 「浸潤させた」ではなく「浸漬させた」溶剤にアセチレンを加圧溶解したもの。","◯ C₂H₂完全燃焼→水+CO₂、高温度発生。","✕ 水素の炭素鋼脆化は高温・高圧下で起こる（常温・大気圧下ではない）。","◯ メタン（分子量16）は無色・無臭で空気より軽い。"]},{"id":72,"sec":"2.17.2","sn":"可燃性ガス","yr":"平成30年 問17","q":"正しいものはどれか。","opts":["常温、標準大気圧（0.1013MPa）下において、水素とメタンの爆発範囲をくらべると、水素の方が広い。","アセチレンは鉄と反応して爆発性化合物であるアセチリドを生成する。","メタンは天然ガスの主成分で、完全燃焼すると水と二酸化炭素を生成するが、不完全燃焼すると一酸化炭素、水素、炭素（すす）なども生成する。","水素は完全燃焼すると水と二酸化炭素を生成するが、不完全燃焼すると一酸化炭素も生成する。"],"chs":["イ、ロ","イ、ハ","ロ、ハ","ロ、ニ","ハ、ニ"],"ans":2,"ok":[1,0,1,0],"ex":["◯ 水素（4〜75vol%）はメタン（5〜15vol%）より爆発範囲が広い。","✕ アセチレンは鉄とはアセチリドを生成しない。銅・銀と反応する。","◯ メタン完全燃焼→水+CO₂。不完全燃焼→CO・H₂・すすなども生成。","✕ 水素（H₂）は炭素を含まないため不完全燃焼でもCOを生成しない。"]},{"id":73,"sec":"2.17.3","sn":"塩素","yr":"令和5年 問18","q":"塩素について正しいものはどれか。","opts":["気体は、同一の温度、圧力、体積において空気より軽く、激しい刺激臭がある。","支燃性かつ毒性のガスである。","有機化合物が混入すると、発熱反応を起こして災害の原因になることがある。","除害剤として希硫酸を使用した。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":3,"ok":[0,1,1,0],"ex":["✕ 塩素（Cl₂：分子量71）の気体は空気より重い（「軽く」が誤り）。","◯ 塩素は支燃性かつ毒性のガス。","◯ 有機化合物混入→発熱反応→災害の原因になることがある。","✕ 塩素の除害剤はアルカリ性のもの（NaOH・消石灰等）。希硫酸（酸性）は誤り。"]},{"id":74,"sec":"2.17.3","sn":"塩素","yr":"令和4年 問18","q":"塩素について正しいものはどれか。","opts":["気体は、同一の圧力、温度、体積において空気より重く、無臭である。","気体は、可燃性で毒性があり、その毒性はきわめて強い。","水分を含む塩素は、常温でも多くの金属を腐食する。","塩素の漏えい箇所にアンモニア水をしみこませた布を近づけると、塩化アンモニウムが生成され、白煙となって見える。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ハ、ニ"],"ans":4,"ok":[0,0,1,1],"ex":["✕ 塩素は空気より重い点は正しいが、激しい刺激臭がある（「無臭」が誤り）。","✕ 塩素は可燃性ではなく支燃性のガス。","◯ 水分を含む塩素は常温でも多くの金属を腐食する。","◯ アンモニア水+塩素→塩化アンモニウム（NH₄Cl）の白煙が生成される。"]},{"id":75,"sec":"2.17.3","sn":"塩素","yr":"令和3年 問18","q":"塩素について正しいものはどれか。","opts":["気体は、黄緑色で無臭である。","水分を含まない塩素は、常温では多くの金属材料とほとんど反応しないが、チタンとは常温でも激しく腐食させる。","除害剤としてカセイソーダ水溶液を使用した。","塩素と水素の等体積混合気体を加熱すると爆発的に激しく反応する。"],"chs":["イ、ロ","ハ、ニ","イ、ロ、ニ","イ、ハ、ニ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 塩素（Cl₂）の気体は黄緑色であるが、激しい刺激臭がある（「無臭」が誤り）。","◯ 乾燥塩素は多くの金属と反応しないが、チタンとは常温でも激しく反応・腐食する。","◯ カセイソーダ（NaOH）水溶液はアルカリ性の除害剤として適切。","◯ 塩素と水素の等体積混合気体を加熱すると爆発的に反応してHCLが生成する。"]},{"id":76,"sec":"2.17.3","sn":"塩素","yr":"令和2年 問18","q":"塩素について正しいものはどれか。","opts":["気体は、同一の圧力、温度、体積において空気より重く、無色で刺激臭がある。","支燃性、毒性があり、その毒性は強い。","水分を含む塩素は、常温でも多くの金属を腐食する。","有機化合物と反応することはない。"],"chs":["イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ハ","イ、ハ、ニ"],"ans":2,"ok":[0,1,1,0],"ex":["✕ 塩素は空気より重く刺激臭があるが、黄緑色（「無色」が誤り）。","◯ 塩素は支燃性・毒性があり、その毒性は強い。","◯ 水分を含む塩素は常温でも多くの金属を腐食する。","✕ 塩素は有機化合物と反応し、塩素化合物と塩化水素（HCl）が生成して発熱する。"]},{"id":77,"sec":"2.17.3","sn":"塩素","yr":"令和元年 問18","q":"塩素について正しいものはどれか。","opts":["除害剤に希硫酸を用いた。","気体は、同一圧力、温度、体積において空気より重い。","チタンは、水分を含まない塩素とは常温でも激しく反応し腐食される。","塩素の漏えい箇所にアンモニア水をしみこませた布などを近づけると、塩化アンモニウムを生成し、白煙となって見える。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","ロ、ハ、ニ"],"ans":5,"ok":[0,1,1,1],"ex":["✕ 塩素の除害剤はアルカリ性のもの（NaOH・消石灰等）。希硫酸（酸性）は誤り。","◯ 塩素（Cl₂：分子量71）の気体は空気（分子量29）より重い。","◯ チタンは乾燥塩素とも常温で激しく反応し腐食される。","◯ アンモニア水+塩素→塩化アンモニウム（NH₄Cl）の白煙が生成。"]},{"id":78,"sec":"2.17.3","sn":"塩素","yr":"平成30年 問18","q":"塩素について正しいものはどれか。","opts":["気体は、黄緑色で、激しい刺激臭がある。","水分を含む塩素は、常温では金属への腐食性はない。","毒性を有するが、有機化合物と反応することはない。","除害剤には、カセイソーダ水溶液、消石灰などが用いられる。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ハ、ニ"],"ans":2,"ok":[1,0,0,1],"ex":["◯ 塩素（Cl₂）の気体は黄緑色で激しい刺激臭がある。","✕ 水分を含む塩素は常温でも多くの金属を腐食する（「腐食性はない」が誤り）。","✕ 塩素は有機化合物と反応する（「反応しない」が誤り）。","◯ 除害剤にはカセイソーダ水溶液・消石灰などのアルカリ性のものが用いられる。"]},{"id":79,"sec":"2.17.4","sn":"アンモニア","yr":"令和5年 問19","q":"アンモニアについて正しいものはどれか。","opts":["可燃性・毒性ガスで、気体は無色で、同一の温度、圧力、体積において空気より軽く、特有の刺激臭がある。","液体をハロゲン、強酸と接触させると、激しく反応し、爆発・飛散することがある。","配管のガス置換には二酸化炭素が用いられる。","配管にアルミニウム管を使用した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ NH₃（分子量17）は可燃性・毒性、無色・空気より軽い・特有の刺激臭がある。","◯ ハロゲン・強酸と接触すると激しく反応し爆発・飛散することがある。","✕ ガス置換に二酸化炭素を用いると炭酸アンモニウムが生成するため不可。窒素を使う。","✕ アルミニウムはアンモニアと反応するため配管には使用しない。"]},{"id":80,"sec":"2.17.4","sn":"アンモニア","yr":"令和4年 問19","q":"正しいものはどれか。","opts":["アンモニアは、支燃性、毒性ガスで、気体は同一の温度、圧力、体積において空気より重い。","シアン化水素とクロルメチル（塩化メチル）は、いずれも可燃性、毒性ガスである。","クロルメチル（塩化メチル）の配管材料にはアルミニウムおよびアルミニウム合金が適している。","アンモニアの除害剤として大量の水を使用した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":4,"ok":[0,1,0,1],"ex":["✕ アンモニアは支燃性ではなく可燃性・毒性ガス。空気より軽い（分子量17）。","◯ シアン化水素（HCN）とクロルメチル（CH₃Cl）はいずれも可燃性・毒性ガス。","✕ クロルメチルはアルミニウム・アルミニウム合金と反応する可能性があるため使用しない。","◯ アンモニアの除害剤として大量の水を使用できる（水溶性が高い）。"]},{"id":81,"sec":"2.17.4","sn":"アンモニア","yr":"令和3年 問19","q":"アンモニアについて正しいものはどれか。","opts":["毒性、可燃性のガスで、気体は、無色で特有の強い刺激臭があり、同一圧力、温度、体積において空気より軽い。","ハロゲン、強酸と接触すると、激しく反応し、爆発、飛散することがある。","除害剤として消石灰を使用した。","配管に銅管を使用した。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ NH₃は毒性・可燃性、無色・特有の強い刺激臭、空気より軽い。","◯ ハロゲン・強酸と接触すると激しく反応し爆発・飛散することがある。","✕ 消石灰（Ca(OH)₂）はアルカリ性のためアルカリ性のアンモニアには使用できない。水・希硫酸・希塩酸を用いる。","✕ アンモニアの配管に銅管を用いると著しく腐食するため使用しない。"]},{"id":82,"sec":"2.17.4","sn":"アンモニア","yr":"令和2年 問19","q":"正しいものはどれか。","opts":["アンモニアの配管に銅管を用いた。","クロルメチル（塩化メチル）の除害には、大量の水を用いることができる。","アンモニアとシアン化水素は、いずれも可燃性、毒性のガスである。","装置内のアンモニアのガス置換に二酸化炭素を用いた。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ハ、ニ"],"ans":4,"ok":[0,1,1,0],"ex":["✕ アンモニアの配管に銅・銅合金・アルミニウム・アルミニウム合金は使用しない。","◯ クロルメチル（CH₃Cl）は水に少量溶解するため除害に大量の水を使用できる。","◯ アンモニアとシアン化水素はいずれも可燃性・毒性のガス。","✕ CO₂を用いると炭酸アンモニウム（(NH₄)₂CO₃）が生成するため不可。窒素を使う。"]},{"id":83,"sec":"2.17.4","sn":"アンモニア","yr":"令和元年 問19","q":"アンモニアについて正しいものはどれか。","opts":["気体は、無色で特有の刺激臭があり、同一圧力、温度、体積において空気より重い。","配管材料として銅、銅合金が適している。","配管のガス置換に二酸化炭素を使用すると、反応生成物の結晶を生じることがある。","除害剤として大量の水を用いた。"],"chs":["イ、ロ","イ、ハ","ハ、ニ","イ、ロ、ニ","ロ、ハ、ニ"],"ans":3,"ok":[0,0,1,1],"ex":["✕ NH₃（分子量17）の気体は空気（分子量29）より軽い（「重い」が誤り）。","✕ 銅・銅合金はアンモニアと反応して腐食するため使用しない。","◯ CO₂使用→炭酸アンモニウム（(NH₄)₂CO₃）の結晶が生じる。だから窒素を使う。","◯ アンモニアの除害剤として大量の水が使用できる。"]},{"id":84,"sec":"2.17.4","sn":"アンモニア","yr":"平成30年 問19","q":"正しいものはどれか。","opts":["アンモニアの配管に鋼管を用いた。","アンモニアとクロルメチル（塩化メチル）の除害剤としては、いずれも消石灰が適している。","アンモニアは、支燃性、毒性のガスである。","クロルメチル（塩化メチル）とシアン化水素は、いずれも可燃性、毒性のガスである。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ハ","ロ、ニ"],"ans":3,"ok":[1,0,0,1],"ex":["◯ アンモニアの配管には鋼管を使用できる。","✕ アンモニアの除害剤は水・希硫酸・希塩酸（消石灰はアルカリ性のため不可）。","✕ アンモニアは支燃性ではなく可燃性・毒性のガス。","◯ クロルメチル（CH₃Cl）とシアン化水素（HCN）はいずれも可燃性・毒性のガス。"]},{"id":85,"sec":"2.18","sn":"特殊高圧ガス","yr":"令和5年 問20","q":"正しいものはどれか。","opts":["特殊高圧ガスとして定義されている7種類のガスは、すべて可燃性かつ毒性のガスである。","モノシランは、空気中に漏洩すれば、常温でも自然発火が起こる危険性がある。","五フッ化ヒ素として規定されている7種類のガス（フッ素化合物）の中には、可燃性か毒性のガスもある。","三フッ化窒素は、常温でも酸素と容易に反応する。"],"chs":["イ、ロ","イ、ニ","ロ、ハ","ハ、ニ","イ、ロ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 特殊高圧ガス7種（モノシラン・ホスフィン・アルシン・ジボラン・モノゲルマン・ジシラン・セレン化水素）はすべて可燃性かつ毒性。","◯ モノシラン（SiH₄）は空気中に漏洩すると常温でも自然発火する危険性がある。","✕ フッ素化合物7種は6種が不燃性・毒性、1種（三フッ化窒素）が支燃性・毒性。可燃性はない。","✕ 三フッ化窒素（NF₃）は支燃性ガスで常温では酸素と反応しない。"]},{"id":86,"sec":"2.18","sn":"特殊高圧ガス","yr":"令和4年 問20","q":"正しいものはどれか。","opts":["三フッ化窒素は、メタン、アンモニアなどとの混合ガスに点火すると爆発的に反応するおそれがある。","ジボランは、室温でゆっくり分解し、水素と高級ボラン化合物を生成する。","モノシランは、常温ではフッ素、塩素とは反応しない。","アルシンは、自然発火性、毒性ガスであるが、微量であればガスを短時間吸入しても生命に危険を及ぼすことはない。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 三フッ化窒素（NF₃）はメタン・アンモニア・H₂S・COなどの混合ガスに点火すると爆発的に反応するおそれがある。","◯ ジボラン（B₂H₆）は室温でゆっくり分解し、水素と高級ボラン化合物を生成する。","✕ モノシランは常温でフッ素・塩素と爆発的に反応する（「反応しない」が誤り）。","✕ アルシン（AsH₃）は毒性が極めて強く、微量でも短時間吸入で生命に危険がある。"]},{"id":87,"sec":"2.18","sn":"特殊高圧ガス","yr":"令和3年 問20","q":"正しいものはどれか。","opts":["ハロン消火剤は、モノシランに対して支燃性として働く。","モノゲルマンは、自己分解爆発性ガスである。","三フッ化窒素は、毒性、可燃性のガスで、常温で酸素と激しく反応する。","ホスフィンは、毒性、可燃性のガスで、室温でゆっくり分解し、水素と高級ボラン化合物を生成する。"],"chs":["イ、ロ","イ、ハ","イ、ニ","ロ、ニ","ロ、ハ、ニ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ ハロン消火剤はモノシランに対して支燃性として働くため使用してはならない。","◯ モノゲルマン（GeH₄）は自己分解爆発性ガス。","✕ 三フッ化窒素（NF₃）は毒性・支燃性（可燃性ではない）。常温では酸素と反応しない。","✕ 「室温でゆっくり分解し水素と高級ボラン化合物を生成する」のはジボラン（B₂H₆）の説明。ホスフィンは室温で安定。"]},{"id":88,"sec":"2.18","sn":"特殊高圧ガス","yr":"令和2年 問20","q":"正しいものはどれか。","opts":["モノシランは、自然発火性で毒性のガスである。","三フッ化窒素は、フッ素と常温で爆発的に反応する。","ジボランは、室温でゆっくり分解し水素と高級ボラン化合物を生成する。","アルシンは、支燃性、毒性があり、その毒性は極めて強い。"],"chs":["イ、ハ","イ、ニ","ロ、ニ","イ、ロ、ハ","ロ、ハ、ニ"],"ans":1,"ok":[1,0,1,0],"ex":["◯ モノシラン（SiH₄）は自然発火性・毒性のガス。","✕ 三フッ化窒素（NF₃）はフッ素（F₂）とは反応しない。","◯ ジボラン（B₂H₆）は室温でゆっくり分解し水素と高級ボラン化合物を生成する。","✕ アルシン（AsH₃）は可燃性・毒性（支燃性ではない）、毒性は極めて強い。"]},{"id":89,"sec":"2.18","sn":"特殊高圧ガス","yr":"令和元年 問20","q":"正しいものはどれか。","opts":["特殊高圧ガスは、全て可燃性かつ毒性のガスである。","モノゲルマンは、自己分解爆発性のガスである。","モノシランの火炎の消火には、ハロン消火剤が適している。","ホスフィンは、常温ではフッ素、塩素とは反応しない。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ 特殊高圧ガス7種はすべて可燃性かつ毒性のガス。","◯ モノゲルマン（GeH₄）は自己分解爆発性のガス。","✕ ハロン消火剤はモノシランに対して支燃性として働くため使用してはならない。","✕ ホスフィン（PH₃）は常温でフッ素・塩素・硝酸と爆発的に反応する。"]},{"id":90,"sec":"2.18","sn":"特殊高圧ガス","yr":"平成30年 問20","q":"正しいものはどれか。","opts":["モノシランは、空気中で燃焼すると白煙のように見える二酸化ケイ素（SiO₂）の粉末を生じる。","ホスフィンは、毒性、自然発火性のガスである。","ジボランは、酸素とは反応しない。","三フッ化窒素は、毒性、可燃性のガスである。"],"chs":["イ、ロ","イ、ハ","ロ、ニ","ハ、ニ","イ、ロ、ハ"],"ans":1,"ok":[1,1,0,0],"ex":["◯ モノシランは空気中で燃焼するとSiO₂の白煙を生じる。","◯ ホスフィン（PH₃）は毒性・自然発火性のガス。","✕ ジボラン（B₂H₆）は可燃性であり酸素と激しく反応する。","✕ 三フッ化窒素（NF₃）は毒性・支燃性（可燃性ではない）。"]}]
</script>

<script>
(function(){
  "use strict";

  // ---- 安全なログ（画面は壊さない） ----
  function safeLog(msg){
    try { if (window.console && console.error) console.error("[quiz]", msg); } catch(e){}
  }
  window.onerror = function(m, s, l, c, err){
    safeLog((m||"unknown error") + " @" + (l||0) + ":" + (c||0));
    return true; // ブラウザのデフォルトエラー表示のみ抑制。画面のDOMには触れない。
  };

  // ---- localStorage: 完全に遅延・防御的に扱う ----
  var LS_KEY = "hpgas_v5";
  var lsAvailable = null; // null=未判定, true/false=判定済み
  function checkLs(){
    if (lsAvailable !== null) return lsAvailable;
    try {
      var t = "__lstest__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      lsAvailable = true;
    } catch(e) {
      lsAvailable = false;
    }
    return lsAvailable;
  }
  function lsLoad(){
    if (!checkLs()) return {};
    try {
      var d = window.localStorage.getItem(LS_KEY);
      return d ? JSON.parse(d) : {};
    } catch(e) { return {}; }
  }
  function lsSave(r){
    if (!checkLs()) return;
    try { window.localStorage.setItem(LS_KEY, JSON.stringify(r)); } catch(e) {}
  }

  // ---- データ読み込み ----
  var Q = [];
  try {
    var qEl = document.getElementById("qjson");
    Q = qEl ? JSON.parse(qEl.textContent) : [];
  } catch(e) {
    safeLog("Q parse failed: " + e.message);
    Q = [];
  }

  var LB = ["イ","ロ","ハ","ニ"];
  function getSecs() {
    var seen = {}, res = [];
    for (var i = 0; i < Q.length; i++) {
      if (!seen[Q[i].sec]) { seen[Q[i].sec] = 1; res.push({sec: Q[i].sec, name: Q[i].sn}); }
    }
    return res;
  }
  var SECS = getSecs();

  // results は同期的な localStorage アクセスをページ読み込み時に行わない。
  // 起動直後は空で開始し、初回インタラクション後の最初の render で一度だけ遅延ロードする。
  // workList: 現在出題中の問題リスト（モード切替時にのみ確定するスナップショット）。
  //           回答しても途中でリストが変化しないようにし、インデックスのズレを防ぐ。
  var ST = { mode: "all", sec: null, idx: 0, ans: null, results: {}, rnd: false, showSec: false, lsTried: false, workList: null };

  function ensureLoaded(){
    if (ST.lsTried) return;
    ST.lsTried = true;
    var loaded = lsLoad();
    if (loaded && typeof loaded === "object") ST.results = loaded;
  }

  // 現在のモード条件に合う問題を Q から抽出（フィルタのみ。並びは Q の順）。
  function filterQuestions() {
    var qs = [];
    for (var i = 0; i < Q.length; i++) {
      if (ST.mode === "sec" && ST.sec && Q[i].sec !== ST.sec) continue;
      if (ST.mode === "wrong" && ST.results[Q[i].id] !== false) continue;
      qs.push(Q[i]);
    }
    return qs;
  }

  function shuf(a) {
    var b = a.slice();
    for (var i = b.length-1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  // モードに入る/切り替える/ランダム切替時にだけ呼ぶ。ここで workList を確定する。
  function rebuildList() {
    var qs = filterQuestions();
    if (ST.rnd) qs = shuf(qs);
    ST.workList = qs;
    if (ST.idx >= ST.workList.length) ST.idx = Math.max(0, ST.workList.length - 1);
  }

  // 現在の出題リスト（スナップショット）を返す。未構築なら作る。
  function getOrd() {
    if (ST.workList === null) rebuildList();
    return ST.workList;
  }

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function render() {
    var app = document.getElementById("app");
    if (!app) return;

    var ord = getOrd();
    var cur = ord[ST.idx] || null;
    var tot = 0, cor = 0;
    for (var k in ST.results) { if (ST.results.hasOwnProperty(k)) { tot++; if (ST.results[k]) cor++; } }
    var wc = 0;
    for (var i = 0; i < Q.length; i++) { if (ST.results[Q[i].id] === false) wc++; }
    var pct = tot > 0 ? Math.round(cor/tot*100) : 0;

    if (!cur && ST.mode === "wrong") {
      app.className = "empty";
      app.innerHTML = "<div style='font-size:48px;margin-bottom:12px'>&#127881;</div>"
        + "<div style='color:#15803d;font-size:18px;font-weight:700;margin-bottom:8px'>間違えた問題はありません！</div>"
        + "<p style='color:#166534;margin-bottom:16px'>すべての問題に正解しました。</p>"
        + "<button id='backBtn' style='background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer'>全問モードに戻る</button>";
      var bb = document.getElementById("backBtn");
      if (bb) bb.onclick = function() { cm("all"); };
      return;
    }
    app.className = "";

    if (!Q.length) {
      app.innerHTML = "<p style='padding:40px;text-align:center;color:#991b1b'>問題データの読み込みに失敗しました。ページを再読み込みしてください。</p>";
      return;
    }
    if (!cur) { app.innerHTML = "<p style='padding:40px;text-align:center'>問題がありません。</p>"; return; }

    var bw = tot > 0 ? Math.round(cor/tot*100) : 0;
    var frag = [];

    frag.push('<div class="hdr">');
    frag.push('<div class="hdr-t">&#9889; 高圧ガス保安 クイズ</div>');
    frag.push('<div class="hdr-s">全' + Q.length + '問 | 正解 ' + cor + ' / 回答 ' + tot + ' | ' + pct + '%</div>');
    frag.push('<div class="hdr-b">');
    frag.push('<button id="rstBtn" class="btn btn-r">リセット</button>');
    frag.push('<button id="rndBtn" class="btn btn-n' + (ST.rnd ? " on" : "") + '">&#128256; ' + (ST.rnd ? "ON" : "ランダム") + '</button>');
    frag.push('</div>');
    frag.push('<div class="sbar"><div class="sfill" style="width:' + bw + '%"></div></div>');
    frag.push('</div>');

    frag.push('<div class="modes">');
    frag.push('<button id="allBtn" class="mb' + (ST.mode === "all" ? " act" : "") + '">全問 (' + Q.length + ')</button>');
    frag.push('<div class="smenu">');
    frag.push('<button id="secBtn" class="mb' + (ST.mode === "sec" ? " act" : "") + '">' + (ST.mode === "sec" && ST.sec ? esc(ST.sec) : "セクション") + ' &#9660;</button>');
    if (ST.showSec) {
      frag.push('<div class="sdd" id="sdd">');
      for (var i = 0; i < SECS.length; i++) {
        var cnt = 0;
        for (var j = 0; j < Q.length; j++) { if (Q[j].sec === SECS[i].sec) cnt++; }
        frag.push('<button class="si' + (ST.sec === SECS[i].sec ? " act" : "") + '" data-sec="' + esc(SECS[i].sec) + '">' + esc(SECS[i].sec) + " " + esc(SECS[i].name) + "（" + cnt + "問）</button>");
      }
      frag.push('</div>');
    }
    frag.push('</div>');
    frag.push('<button id="wrgBtn" class="mb' + (ST.mode === "wrong" ? " act" : "") + '"' + (wc === 0 ? " disabled" : "") + '>&#10060; 間違い (' + wc + ')</button>');
    frag.push('</div>');

    var pp = Math.round((ST.idx+1)/ord.length*100);
    frag.push('<div class="pr"><span class="ps">' + esc(cur.sec) + " | " + esc(cur.sn) + '</span><span class="pn">' + (ST.idx+1) + " / " + ord.length + '</span></div>');
    frag.push('<div class="pt"><div class="pf" style="width:' + pp + '%"></div></div>');

    var ri = ST.results[cur.id] !== undefined ? (ST.results[cur.id] ? '<span class="ri">&#9989;</span>' : '<span class="ri">&#10060;</span>') : "";
    frag.push('<div class="qc">');
    frag.push('<div class="qt"><span class="ytag">&#12304;' + esc(cur.yr) + '&#12305;</span>' + ri + '</div>');
    frag.push('<p class="qq">次のイ、ロ、ハ、ニの記述のうち、' + esc(cur.q) + '</p>');
    frag.push('<div class="ob">');
    for (var i = 0; i < cur.opts.length; i++) {
      frag.push('<div class="or"><span class="ol">' + LB[i] + '.</span><span class="ot">' + esc(cur.opts[i]) + '</span></div>');
    }
    frag.push('</div></div>');

    frag.push('<div class="chs">');
    for (var i = 0; i < cur.chs.length; i++) {
      var n = i+1, isSel = ST.ans === n, isOk = cur.ans === n;
      var cls = "ch";
      if (ST.ans !== null) { if (isOk) cls += " ok"; else if (isSel) cls += " ng"; }
      var mk = ST.ans !== null ? (isOk ? " &#10003;" : isSel ? " &#10007;" : "") : "";
      frag.push('<div class="' + cls + '" data-n="' + n + '"><span class="cn">(' + n + ')</span>' + esc(cur.chs[i]) + mk + '</div>');
    }
    frag.push('</div>');

    if (ST.ans !== null) {
      var isRight = ST.results[cur.id];
      frag.push('<div class="ex ' + (isRight ? "ok" : "ng") + '">');
      frag.push('<div class="ext ' + (isRight ? "ok" : "ng") + '">' + (isRight ? "&#9989; 正解！" : "&#10060; 不正解　正解は (" + cur.ans + ") " + esc(cur.chs[cur.ans-1])) + '</div>');
      for (var i = 0; i < cur.opts.length; i++) {
        frag.push('<div class="er"><span class="el ' + (cur.ok[i] ? "ok" : "ng") + '">' + LB[i] + '</span><span class="et">' + esc(cur.ex[i]) + '</span></div>');
      }
      frag.push('</div>');
    }

    frag.push('<div class="nav">');
    frag.push('<button id="prevBtn" class="nb"' + (ST.idx === 0 ? " disabled" : "") + '>&#8592; 前の問題</button>');
    if (ST.ans !== null && ST.idx < ord.length-1) {
      frag.push('<button id="nextBtn" class="nb nx">次の問題 &#8594;</button>');
    } else if (ST.ans !== null && ST.idx === ord.length-1) {
      frag.push('<span style="color:#059669;font-weight:600;font-size:13px">&#127919; 最後の問題！</span>');
    }
    frag.push('</div>');

    frag.push('<div class="sc">');
    frag.push('<div class="sci"><div class="scn" style="color:#3b82f6">' + tot + '</div><div class="scl">回答済み</div></div>');
    frag.push('<div class="sci"><div class="scn" style="color:#22c55e">' + cor + '</div><div class="scl">正解</div></div>');
    frag.push('<div class="sci"><div class="scn" style="color:#ef4444">' + (tot-cor) + '</div><div class="scl">不正解</div></div>');
    frag.push('<div class="sci"><div class="scn" style="color:#8b5cf6">' + pct + '%</div><div class="scl">正解率</div></div>');
    frag.push('</div>');

    app.innerHTML = frag.join("");

    var rb = document.getElementById("rstBtn"); if (rb) rb.onclick = rst;
    var nb = document.getElementById("rndBtn"); if (nb) nb.onclick = tRnd;
    var ab = document.getElementById("allBtn"); if (ab) ab.onclick = function() { cm("all"); };
    var sb = document.getElementById("secBtn"); if (sb) sb.onclick = function(ev){ if(ev&&ev.stopPropagation)ev.stopPropagation(); tSec(); };
    var wb = document.getElementById("wrgBtn"); if (wb) wb.onclick = function() { cm("wrong"); };
    var pv = document.getElementById("prevBtn"); if (pv) pv.onclick = gP;
    var nxt = document.getElementById("nextBtn"); if (nxt) nxt.onclick = gN;

    var sis = document.querySelectorAll(".si[data-sec]");
    for (var i = 0; i < sis.length; i++) {
      (function(s) { s.onclick = function(ev) { if(ev&&ev.stopPropagation)ev.stopPropagation(); cm("sec", s.getAttribute("data-sec")); }; })(sis[i]);
    }
    var chs = document.querySelectorAll(".ch[data-n]");
    for (var i = 0; i < chs.length; i++) {
      (function(c) { c.onclick = function() { da(parseInt(c.getAttribute("data-n"), 10)); }; })(chs[i]);
    }
  }

  function da(n) {
    if (ST.ans !== null) return;
    var ord = getOrd(), cur = ord[ST.idx];
    if (!cur) return;
    ST.ans = n;
    ST.results[cur.id] = (n === cur.ans);
    lsSave(ST.results);
    // 重要: ここでは workList を作り直さない。
    // 間違いモードで正解してもリストはそのまま固定。インデックスがズレず答え合わせが見える。
    render();
  }
  function gN() {
    var o = getOrd();
    if (ST.idx < o.length - 1) { ST.idx++; ST.ans = null; }
    render();
  }
  function gP() {
    if (ST.idx > 0) { ST.idx--; ST.ans = null; }
    render();
  }
  function cm(m, s) {
    ST.mode = m;
    ST.sec = s || null;
    ST.idx = 0;
    ST.ans = null;
    ST.rnd = false;
    ST.showSec = false;
    rebuildList();   // モード切替時にリストを確定
    render();
  }
  function tRnd() {
    ST.rnd = !ST.rnd;
    ST.idx = 0;
    ST.ans = null;
    rebuildList();   // ランダム切替時にリストを再構築
    render();
  }
  function tSec() { ST.showSec = !ST.showSec; render(); }
  function rst() {
    var ok = true;
    try { ok = window.confirm("記録をすべてリセットしますか？"); } catch(e) { ok = true; }
    if (!ok) return;
    ST.results = {};
    lsSave({});
    ST.idx = 0;
    ST.ans = null;
    ST.mode = "all";
    ST.sec = null;
    ST.rnd = false;
    rebuildList();
    render();
  }

  document.addEventListener("click", function(e) {
    if (ST.showSec) {
      var m = document.querySelector(".smenu");
      if (m && !m.contains(e.target)) { ST.showSec = false; render(); }
    }
  });

  function boot() {
    ensureLoaded();
    ST.ans = null;       // 念のため必ず未回答状態から開始
    rebuildList();       // results 読み込み後にリストを確定
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  // iOS Safari の bfcache（戻る/進むキャッシュ）対策：
  // タブを閉じずに離れて戻ってきた場合、JSの状態（ST.ans など）が
  // そのまま復元されてしまい「未回答なのに解答済み表示」になることがある。
  // pageshow イベントで強制的にクリーンな状態に戻す。
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) {
      ST.ans = null;
      ST.showSec = false;
      rebuildList();     // 復元時もリストを最新の results で作り直す
      render();
    }
  });
})();
</script>
</body>
</html>
